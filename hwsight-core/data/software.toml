# Software worth having for a device, in plain English, for people who aren't technical.
#
# Built into hwsight and replaceable by a newer downloaded copy. `schema` is the file
# format version; `version` is the data release date (YYYY.MM.DD), newest wins.
#
# Each [[software]] entry:
#   id        short unique name, lowercase (e.g. "solaar")
#   name      the program's own name, never translated
#   what      what it does for this kind of device, one or two short sentences
#             (translated through text-<language>.toml like descriptions)
#   homepage  https link to the project
#   commands  program names that mean it's installed if found on PATH (optional)
#   flathub   Flathub app ID, if it's on Flathub (optional)
#   packages  distro package names, same keys as firmware.toml (arch, debian, ubuntu,
#             fedora, opensuse, plus release keys such as ubuntu-jammy). "none" means
#             that release doesn't package it.
#   search    what to type into an app store or search engine to find it (optional,
#             default: name)
#   get       how to get it when the user's distro has no package (optional, translated
#             like `what`). Without it hwsight says to look for `search` in the app
#             store or on Flathub, or to follow the install steps on `homepage`. With
#             `flathub` set, hwsight offers the Flathub install command instead.
#   [[software.match]]  which devices it's for. Same fields as descriptions.toml (bus,
#             class, subclasses, prog_ifs, vendor, device; hex without "0x"). Any one
#             match is enough.
#
# Only recommend free software that's maintained and that people actually use with this
# device. Verification: package names are checked in containers like firmware.toml.
schema = 1
version = "2026.11.06"

[[software]]
id = "solaar"
name = "Solaar"
what = "Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings."
homepage = "https://pwr-solaar.github.io/Solaar/"
commands = ["solaar"]
flathub = "io.github.pwr_solaar.solaar"
packages = { arch = "solaar", debian = "solaar", ubuntu = "solaar", fedora = "solaar", opensuse = "solaar" }
# Logitech Bolt, Unifying, and Lightspeed receivers.
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c548"
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c52b"
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c532"
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c534"
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c539"
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c53a"
[[software.match]]
bus = "usb"
vendor = "046d"
device = "c53f"
[[software.match]]
bus = "usb"
vendor = "046d"
