[[software]]
id = "liquidctl"
name = "liquidctl"
what = "Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights."
homepage = "https://github.com/liquidctl/liquidctl"
commands = ["liquidctl"]
packages = { arch = "liquidctl", debian = "liquidctl", ubuntu = "liquidctl", fedora = "liquidctl", opensuse = "none" }
get = "It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx."
# NZXT coolers and controllers.
[[software.match]]
bus = "usb"
vendor = "1e71"

[[software]]
id = "openrgb"
name = "OpenRGB"
what = "Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans."
homepage = "https://openrgb.org/"
commands = ["openrgb"]
flathub = "org.openrgb.OpenRGB"
packages = { arch = "openrgb", debian = "none", ubuntu = "none", fedora = "openrgb", opensuse = "OpenRGB" }
# ASUS Aura LED controllers.
[[software.match]]
