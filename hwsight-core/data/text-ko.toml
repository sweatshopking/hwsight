# Translations of the text in descriptions.toml and fixes.toml, language: ko.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "ko"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "그래픽 카드입니다. 화면에 보이는 모든 것을 그리고, 게임과 동영상에서 무거운 작업을 맡습니다."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "스피커, 헤드폰 또는 모니터로 소리를 보내고 마이크에서 소리를 가져옵니다."
"Connects your computer to a network with a cable (wired Ethernet)." = "케이블(유선 이더넷)을 사용하여 컴퓨터를 네트워크에 연결합니다."
"Connects your computer to wireless networks (Wi-Fi)." = "컴퓨터를 무선 네트워크(Wi-Fi)에 연결합니다."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "시스템, 프로그램, 파일을 보관하는 빠른 스토리지 드라이브(NVMe SSD)입니다."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "하드 드라이브, SSD, DVD 드라이브와 같은 SATA 드라이브를 컴퓨터에 연결합니다."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "USB 포트 그룹을 제어하여 연결한 장치가 컴퓨터와 통신할 수 있게 합니다."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "USB4 및 Thunderbolt 포트를 제어합니다. 도크, 드라이브, 디스플레이를 위한 매우 빠른 연결입니다."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "마더보드가 온도, 팬 속도 등의 센서를 읽고 메모리와 통신하는 데 사용하는 작은 내부 연결입니다."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "프로세서를 컴퓨터의 나머지 부분에 연결합니다. 마더보드의 일부이며 드라이버 없이 작동합니다."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "펌웨어 칩 및 팬 제어와 같이 속도가 느린 마더보드 부품을 연결합니다."
"Links expansion slots and built-in devices to the processor." = "확장 슬롯과 내장 장치를 프로세서에 연결합니다."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "장치가 읽지 말아야 할 메모리를 읽지 못하게 합니다. 보안 및 가상 머신에 사용됩니다."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "암호화를 처리하고 비밀번호, 디스크 키와 같은 비밀을 보호하는 보안 칩입니다."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "AI 작업을 빠르고 효율적으로 실행하는 AI 가속기(신경 처리 장치)입니다."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "무선 헤드폰, 컨트롤러, 키보드 등에 Bluetooth를 추가합니다."
"Connects older storage drives and other devices that use the SCSI standard." = "SCSI 표준을 사용하는 기존 스토리지 드라이브 및 기타 장치를 연결합니다."
"Connects older hard drives and other storage devices that use the IDE standard." = "IDE 표준을 사용하는 기존 하드 드라이브 및 기타 저장 장치를 연결합니다."
"Combines several storage drives so they can work together for speed or protection." = "속도나 보호를 위해 함께 작동할 수 있도록 여러 스토리지 드라이브를 결합합니다."
"Connects storage drives that use the ATA standard." = "ATA 표준을 사용하는 스토리지 드라이브를 연결합니다."
"Connects storage drives that use the SAS standard." = "SAS 표준을 사용하는 스토리지 드라이브를 연결합니다."
"Connects a storage device that does not use a more specific standard." = "보다 구체적인 표준을 사용하지 않는 저장 장치를 연결합니다."
"A second graphics processor that can help draw games, videos, and other pictures." = "게임, 비디오 및 기타 그림을 그리는 데 도움이 되는 보조 그래픽 프로세서입니다."
"Captures video from a camera, television signal, or another video source." = "카메라, TV 신호 또는 기타 비디오 소스에서 비디오를 캡처합니다."
"An older sound card that plays and records sound." = "소리를 재생하고 녹음하는 오래된 사운드 카드입니다."
"Connects older devices through a serial port, one bit at a time." = "직렬 포트를 통해 한 번에 한 비트씩 기존 장치를 연결합니다."
"Connects older printers and other devices through a parallel port." = "병렬 포트를 통해 구형 프린터와 기타 장치를 연결합니다."
"Connects to the internet or another computer through a modem." = "모뎀을 통해 인터넷이나 다른 컴퓨터에 연결합니다."
"Reads memory cards through an SD card slot." = "SD 카드 슬롯을 통해 메모리 카드를 읽습니다."
"Connects older FireWire devices, such as cameras and storage drives." = "카메라, 스토리지 드라이브 등 구형 FireWire 장치를 연결합니다."
"Connects high-speed networks used by servers and other specialised computers." = "서버 및 기타 특수 컴퓨터에서 사용되는 고속 네트워크를 연결합니다."
"Connects devices through another type of serial bus." = "다른 유형의 직렬 버스를 통해 장치를 연결합니다."
"Connects a wireless device that does not use a more specific wireless standard." = "보다 구체적인 무선 표준을 사용하지 않는 무선 장치를 연결합니다."
"Helps the computer manage power or improve performance." = "컴퓨터가 전원을 관리하거나 성능을 향상시키는 데 도움이 됩니다."
"A special-purpose device used to inspect or test the computer." = "컴퓨터를 검사하거나 테스트하는 데 사용되는 특수 목적 장치입니다."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "헤드셋, 마이크, 오디오 인터페이스 등 USB를 통해 사운드를 재생하거나 녹음합니다."
"A network or modem connection over USB." = "USB를 통한 네트워크 또는 모뎀 연결."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "키보드, 마우스, 게임 컨트롤러, 리모컨처럼 컴퓨터를 조작할 수 있게 해 줍니다. 일부 조명 및 냉각 장치도 이런 연결을 사용합니다."
"A camera or scanner that transfers pictures to the computer." = "사진을 컴퓨터로 전송하는 카메라 또는 스캐너."
"A printer connected by USB." = "USB로 연결된 프린터."
"Stores files: a USB stick, card reader, or external drive." = "파일 저장: USB 스틱, 카드 리더기, 외장 드라이브."
"Adds more USB ports by sharing one connection." = "하나의 연결을 공유하여 더 많은 USB 포트를 추가합니다."
"Reads smart cards, like ID, bank, or security cards." = "신분증, 은행 카드, 보안 카드 등의 스마트 카드를 읽습니다."
"A webcam or video capture device." = "웹캠 또는 비디오 캡처 장치."
"Connects a personal healthcare device, such as a blood pressure monitor." = "혈압계 등 개인 건강 관리 장치를 연결합니다."
"Plays or records sound and video over USB." = "USB를 통해 사운드와 비디오를 재생하거나 녹음합니다."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "USB-C 도크 또는 어댑터가 연결 모드 중 하나를 사용할 수 없음을 보고합니다."
"A USB device used to inspect or test another device." = "다른 장치를 검사하거나 테스트하는 데 사용되는 USB 장치입니다."
"A USB device with a special purpose that does not fit another group." = "다른 그룹에 맞지 않는 특별한 목적을 가진 USB 장치입니다."
"A USB device in firmware update mode." = "펌웨어 업데이트 모드의 USB 장치."
"A game controller (Xbox style)." = "게임 컨트롤러(Xbox 스타일)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "NZXT 수랭 쿨러의 펌프, 팬, 조명을 제어합니다."
"Controls the RGB lighting on your motherboard." = "마더보드의 RGB 조명을 제어합니다."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "로지텍 키보드 및 마우스(Logi Bolt)용 무선 수신기입니다."
"Draws everything you see on your screen." = "화면에 보이는 모든 것을 그립니다."
"Plays sound through your speakers or headphones, and records from microphones." = "스피커나 헤드폰을 통해 소리를 재생하고 마이크에서 녹음합니다."
"Connects your computer to the internet and other computers." = "컴퓨터를 인터넷 및 다른 컴퓨터에 연결합니다."
"Stores your system, programs, and files, or connects the drives that do." = "시스템, 프로그램, 파일을 저장하거나 해당 드라이브를 연결합니다."
"Runs USB ports, so the things you plug in can talk to the computer." = "USB 포트를 제어하여 연결한 장치가 컴퓨터와 통신할 수 있게 합니다."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Thunderbolt 및 USB4 포트를 제어합니다. 도크, 드라이브, 디스플레이를 위한 매우 빠른 연결입니다."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "키보드, 마우스, 게임 컨트롤러 같은 장치로 컴퓨터를 조작할 수 있게 해 줍니다."
"Captures video or pictures, like a webcam." = "웹캠처럼 비디오나 사진을 캡처합니다."
"Prints or scans documents and photos." = "문서와 사진을 인쇄하거나 스캔합니다."
"Sends data over older-style connections such as serial ports and modems." = "직렬 포트 및 모뎀과 같은 이전 스타일 연결을 통해 데이터를 보냅니다."
"Handles encryption and protects secrets like passwords and disk keys." = "암호화를 처리하고 비밀번호, 디스크 키와 같은 비밀을 보호합니다."
"Speeds up special kinds of work, such as AI tasks." = "AI 작업 등 특수한 종류의 작업 속도를 높입니다."
"Part of the processor, the computer's main brain." = "프로세서의 일부입니다. 프로세서는 컴퓨터의 두뇌입니다."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "컴퓨터가 계속 작동하도록 하는 마더보드의 내장 부품입니다. 보통은 신경 쓸 필요가 없습니다."
"A device that doesn't fit the usual groups." = "일반적인 그룹에 맞지 않는 장치입니다."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "누락된 펌웨어가 들어 있는 패키지({package})를 설치한 다음 컴퓨터를 다시 시작하세요."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "드라이버에 펌웨어 파일 {file}이(가) 필요하지만 설치되어 있지 않습니다. 배포판 패키지에서 해당 파일 이름을 검색해 그 패키지를 설치한 다음 다시 시작하세요."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "컴퓨터를 다시 시작하세요. 필요한 펌웨어는 이제 설치되어 있지만 컴퓨터가 시작될 때는 없었습니다."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "장치가 제시간에 드라이버에 응답하지 않았습니다. 컴퓨터를 다시 시작하세요. 컴퓨터 내부의 카드라면 슬롯에 단단히 꽂혀 있는지, 전원 케이블(있는 경우)이 연결되어 있는지 확인하세요."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "장치가 오류로 응답했습니다. 컴퓨터를 다시 시작하세요. 계속 발생하면 장치나 연결에 결함이 있을 수 있습니다. 가능하면 다른 포트나 슬롯을 사용해 보세요."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "다른 드라이버가 이미 이 장치를 사용하고 있을 수 있습니다. 일반적으로 컴퓨터를 다시 시작하면 이 문제가 해결됩니다."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "드라이버가 장치를 시작하지 못했습니다. 컴퓨터를 다시 시작하세요. 계속 발생하면 장치의 하드웨어 ID({hardware_id})를 \"Linux\"와 함께 온라인에서 검색하세요."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "이 장치의 드라이버({module})가 설치되었지만 실행되고 있지 않습니다. 지금 이 명령으로 시작하세요. 일반적으로 다시 시작한 후 자동으로 시작됩니다."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "{module} 드라이버가 {file}의 설정으로 꺼져 있습니다. 다시 켜려면 그 파일에서 {module}이(가) 들어 있는 줄을 삭제한 다음 다시 시작하세요. 이런 설정은 다른 그래픽 드라이버를 설치할 때처럼 의도적으로 추가되기도 합니다."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "{module} 드라이버가 부팅 설정(커널 명령줄)에서 꺼져 있습니다. 그곳의 blacklist 옵션에서 \"{module}\"을(를) 제거한 다음 다시 시작하세요."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "{module} 드라이버가 실행 중이지만 이 장치를 사용하지 않았습니다. 컴퓨터를 다시 시작하면 이 문제가 해결되는 경우가 많습니다. 그렇지 않은 경우 일반적으로 그 이유가 위에 나와 있습니다."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "드라이버가 시작되었지만 장치 설정을 마치지 못했습니다. 컴퓨터를 다시 시작하세요. 그래도 해결되지 않으면 보통 위에 이유가 나와 있습니다(펌웨어 누락인 경우가 많음)."
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\". A later version of hwsight will suggest driver packages for many devices." = "이 컴퓨터에 설치된 드라이버 중 이 장치를 지원하는 드라이버가 없습니다. \"Linux 드라이버\"와 함께 하드웨어 ID({hardware_id})를 온라인으로 검색하세요. hwsight의 이후 버전에서는 많은 장치에 대한 드라이버 패키지를 제안합니다."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "이 장치는 USB 보안 설정(예: USBGuard)에 의해 차단되었습니다. 신뢰한다면 해당 설정에서 허용한 다음 플러그를 뽑았다가 다시 연결하세요."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Logitech 무선 마우스 및 키보드를 수신기와 페어링하고 배터리 잔량과 설정을 표시합니다."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "수랭 쿨러와 일부 파워 서플라이의 온도, 펌프 및 팬 속도를 표시하고 속도와 조명을 변경할 수 있게 해 줍니다."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "명령줄 프로그램입니다. 웹사이트에 배포판별 설치 방법이 있으며, Python의 pipx를 사용해 어디서나 작동하는 방법도 있습니다."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "마더보드, 메모리, 키보드, 팬 등 다양한 브랜드의 RGB 장치 조명을 한 곳에서 제어합니다."
