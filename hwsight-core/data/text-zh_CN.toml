# Translations of the text in descriptions.toml and fixes.toml, language: zh_CN.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "zh_CN"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "你的显卡。它负责绘制你在屏幕上看到的一切，并承担游戏和视频中的繁重工作。"
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "将声音发送到扬声器、耳机或显示器，并从麦克风接收声音。"
"Connects your computer to a network with a cable (wired Ethernet)." = "使用电缆将计算机连接到网络（有线以太网）。"
"Connects your computer to wireless networks (Wi-Fi)." = "将你的计算机连接到无线网络（Wi-Fi）。"
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "用于保存系统、程序和文件的快速存储驱动器（NVMe SSD）。"
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "将 SATA 驱动器（例如硬盘驱动器、SSD 和 DVD 驱动器）连接到计算机。"
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "管理一组 USB 端口，让你插入的设备能与计算机通信。"
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "管理 USB4 和 Thunderbolt 端口：为扩展坞、驱动器和显示器提供非常快的连接。"
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "主板用于读取传感器（例如温度和风扇速度）并与内存通信的小型内部连接。"
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "将处理器连接到计算机的其余部分。它是主板的一部分，无需驱动程序即可工作。"
"Connects slower motherboard parts, like the firmware chip and fan controls." = "连接速度较慢的主板部件，例如固件芯片和风扇控制。"
"Links expansion slots and built-in devices to the processor." = "将扩展插槽和内置设备链接到处理器。"
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "防止设备读取不应读取的内存。用于安全和虚拟机。"
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "一种安全芯片，用于处理加密并保护密码和磁盘密钥等机密。"
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "快速高效地运行 AI 任务的 AI 加速器（神经处理单元）。"
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "添加蓝牙功能，可用于无线耳机、手柄、键盘等。"
"Connects older storage drives and other devices that use the SCSI standard." = "连接较旧的存储驱动器和其他使用 SCSI 标准的设备。"
"Connects older hard drives and other storage devices that use the IDE standard." = "连接较旧的硬盘驱动器和其他使用 IDE 标准的存储设备。"
"Combines several storage drives so they can work together for speed or protection." = "组合多个存储驱动器，以便它们可以协同工作以提高速度或提供保护。"
"Connects storage drives that use the ATA standard." = "连接使用 ATA 标准的存储驱动器。"
"Connects storage drives that use the SAS standard." = "连接使用 SAS 标准的存储驱动器。"
"Connects a storage device that does not use a more specific standard." = "连接不使用更具体标准的存储设备。"
"A second graphics processor that can help draw games, videos, and other pictures." = "第二个图形处理器，可以帮助绘制游戏、视频和其他画面。"
"Captures video from a camera, television signal, or another video source." = "从摄像机、电视信号或其他视频源捕获视频。"
"An older sound card that plays and records sound." = "一种用于播放和录制声音的较旧声卡。"
"Connects older devices through a serial port, one bit at a time." = "通过串行端口连接旧设备，一次一位。"
"Connects older printers and other devices through a parallel port." = "通过并行端口连接旧打印机和其他设备。"
"Connects to the internet or another computer through a modem." = "通过调制解调器连接到互联网或另一台计算机。"
"Reads memory cards through an SD card slot." = "通过 SD 卡插槽读取存储卡。"
"Connects older FireWire devices, such as cameras and storage drives." = "连接较旧的 FireWire 设备，例如相机和存储驱动器。"
"Connects high-speed networks used by servers and other specialised computers." = "连接服务器和其他专用计算机使用的高速网络。"
"Connects devices through another type of serial bus." = "通过另一种类型的串行总线连接设备。"
"Connects a wireless device that does not use a more specific wireless standard." = "连接不使用更具体无线标准的无线设备。"
"Helps the computer manage power or improve performance." = "帮助计算机管理电源或提高性能。"
"A special-purpose device used to inspect or test the computer." = "用于检查或测试计算机的专用设备。"
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "通过 USB 播放或录制声音，例如耳机、麦克风或音频接口。"
"A network or modem connection over USB." = "通过 USB 的网络或调制解调器连接。"
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "让你控制计算机，例如键盘、鼠标、游戏手柄或遥控器。一些灯光和散热小设备也使用这种连接。"
"A camera or scanner that transfers pictures to the computer." = "将图片传输到计算机的相机或扫描仪。"
"A printer connected by USB." = "通过 USB 连接的打印机。"
"Stores files: a USB stick, card reader, or external drive." = "存储文件：USB 记忆棒、读卡器或外部驱动器。"
"Adds more USB ports by sharing one connection." = "通过共享一个连接来添加更多 USB 端口。"
"Reads smart cards, like ID, bank, or security cards." = "读取智能卡，例如身份证卡、银行卡或安全卡。"
"A webcam or video capture device." = "网络摄像头或视频捕获设备。"
"Connects a personal healthcare device, such as a blood pressure monitor." = "连接个人医疗保健设备，例如血压计。"
"Plays or records sound and video over USB." = "通过 USB 播放或录制声音和视频。"
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "报告 USB-C 坞站或适配器无法使用其连接模式之一。"
"A USB device used to inspect or test another device." = "用于检查或测试其他设备的 USB 设备。"
"A USB device with a special purpose that does not fit another group." = "具有特殊用途、不适合其他组的 USB 设备。"
"A USB device in firmware update mode." = "处于固件更新模式的 USB 设备。"
"A game controller (Xbox style)." = "游戏手柄（Xbox 风格）。"
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "控制 NZXT 水冷散热器的水泵、风扇和灯光。"
"Controls the RGB lighting on your motherboard." = "控制主板上的 RGB 灯光。"
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "适用于罗技键盘和鼠标 (Logi Bolt) 的无线接收器。"
"Draws everything you see on your screen." = "绘制你在屏幕上看到的一切。"
"Plays sound through your speakers or headphones, and records from microphones." = "通过扬声器或耳机播放声音，并通过麦克风录音。"
"Connects your computer to the internet and other computers." = "将你的计算机连接到互联网和其他计算机。"
"Stores your system, programs, and files, or connects the drives that do." = "存储你的系统、程序和文件，或连接存储它们的驱动器。"
"Runs USB ports, so the things you plug in can talk to the computer." = "管理 USB 端口，让你插入的设备能与计算机通信。"
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "管理 Thunderbolt 和 USB4 端口：为扩展坞、驱动器和显示器提供非常快的连接。"
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "让你控制计算机：键盘、鼠标、游戏手柄和类似设备。"
"Captures video or pictures, like a webcam." = "捕捉视频或图片，就像网络摄像头一样。"
"Prints or scans documents and photos." = "打印或扫描文档和照片。"
"Sends data over older-style connections such as serial ports and modems." = "通过旧式连接（例如串行端口和调制解调器）发送数据。"
"Handles encryption and protects secrets like passwords and disk keys." = "处理加密并保护密码和磁盘密钥等机密。"
"Speeds up special kinds of work, such as AI tasks." = "加快特殊类型的工作，例如人工智能任务。"
"Part of the processor, the computer's main brain." = "处理器的一部分，处理器是计算机的大脑。"
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "主板的内置部分，让计算机保持运行。通常你不需要关心它。"
"A device that doesn't fit the usual groups." = "不属于常见类别的设备。"
"Install the package that contains the missing firmware ({package}), then restart the computer." = "安装包含缺少的固件 ({package}) 的软件包，然后重新启动计算机。"
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "驱动程序需要固件文件 {file}，但它没有安装。请在发行版的软件包中搜索该文件名，安装对应的软件包，然后重新启动。"
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "请重新启动计算机。所需的固件现在已经安装，但计算机启动时还没有。"
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "设备没有及时响应驱动程序。请重新启动计算机。如果它是计算机内部的板卡，请检查它是否已牢固插入插槽，以及电源线（如果有）是否已连接。"
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "设备返回了错误。请重新启动计算机。如果问题持续出现，设备或其连接可能有故障：如果可以，请换一个端口或插槽试试。"
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "另一个驱动程序可能已经在使用该设备。重新启动计算机通常可以解决此问题。"
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "驱动程序无法启动设备。请重新启动计算机。如果问题持续出现，请在网上搜索设备的硬件 ID（{hardware_id}）加上“Linux”。"
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "此设备的驱动程序（{module}）已安装，但没有运行。现在用这条命令启动它。它通常会在重新启动后自行启动。"
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "{module} 驱动程序被 {file} 中的一项设置关闭了。要重新开启它，请从该文件中删除提到 {module} 的那一行，然后重新启动。这类设置有时是故意添加的，例如在安装另一个显卡驱动程序时。"
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "{module} 驱动程序在启动设置（内核命令行）中被关闭了。请从那里的 blacklist 选项中删除“{module}”，然后重新启动。"
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "{module} 驱动程序正在运行，但没有接管此设备。重新启动计算机通常可以解决。如果不行，原因通常显示在上方。"
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "驱动程序已启动，但没有完成设备的设置。请重新启动计算机。如果没有帮助，原因通常显示在上方（通常是缺少固件）。"
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "此设备被你的 USB 安全设置（例如 USBGuard）阻止了。如果你信任它，请在这些设置中允许它，然后拔下并重新插入。"
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "将罗技无线鼠标和键盘与其接收器配对，并显示其电池电量和设置。"
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "显示水冷散热器和部分电源的温度、水泵和风扇转速，并让你调整它们的转速和灯光。"
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "这是一个命令行程序。它的网站上有每个发行版的安装步骤，其中一种方法通过 Python 的 pipx 在任何系统上都能使用。"
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "在一处控制多个品牌的 RGB 设备上的灯光，例如主板、内存、键盘和风扇。"
