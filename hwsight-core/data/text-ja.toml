# Translations of the text in descriptions.toml and fixes.toml, language: ja.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "ja"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "お使いのグラフィックス カードです。画面に表示されるすべてを描画し、ゲームや動画の重い処理を担当します。"
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "サウンドをスピーカー、ヘッドフォン、またはモニターに送信し、マイクからサウンドを取り込みます。"
"Connects your computer to a network with a cable (wired Ethernet)." = "コンピュータをケーブル (有線 Ethernet) でネットワークに接続します。"
"Connects your computer to wireless networks (Wi-Fi)." = "コンピュータをワイヤレス ネットワーク (Wi-Fi) に接続します。"
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "システム、プログラム、ファイルを保存する高速ストレージ ドライブ (NVMe SSD)。"
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "ハードドライブ、SSD、DVD ドライブなどの SATA ドライブをコンピュータに接続します。"
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "USB ポートのグループを制御し、接続したデバイスがコンピューターと通信できるようにします。"
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "USB4 と Thunderbolt のポートを制御します。ドック、ドライブ、ディスプレイ向けのとても高速な接続です。"
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "マザーボードが温度やファン速度などのセンサーを読み取り、メモリと通信するために使用する小さな内部接続。"
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "プロセッサをコンピュータの残りの部分に接続します。これはマザーボードの一部であり、ドライバーなしで動作します。"
"Connects slower motherboard parts, like the firmware chip and fan controls." = "ファームウェア チップやファン コントロールなど、低速のマザーボード部品を接続します。"
"Links expansion slots and built-in devices to the processor." = "拡張スロットと内蔵デバイスをプロセッサーにリンクします。"
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "デバイスが読むべきでないメモリを読めないようにします。セキュリティや仮想マシンに使われます。"
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "暗号化を処理し、パスワードやディスク キーなどの秘密を保護するセキュリティ チップ。"
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "AI タスクを迅速かつ効率的に実行する AI アクセラレータ (ニューラル プロセッシング ユニット)。"
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "ワイヤレス ヘッドフォン、コントローラ、キーボードなど用の Bluetooth を追加します。"
"Connects older storage drives and other devices that use the SCSI standard." = "SCSI 標準を使用する古いストレージ ドライブやその他のデバイスを接続します。"
"Connects older hard drives and other storage devices that use the IDE standard." = "IDE 標準を使用する古いハード ドライブやその他のストレージ デバイスを接続します。"
"Combines several storage drives so they can work together for speed or protection." = "複数のストレージ ドライブを組み合わせて、速度や保護のために連携できるようにします。"
"Connects storage drives that use the ATA standard." = "ATA規格を使用するストレージドライブを接続します。"
"Connects storage drives that use the SAS standard." = "SAS規格を使用するストレージドライブを接続します。"
"Connects a storage device that does not use a more specific standard." = "より特殊な規格を使用しないストレージ デバイスを接続します。"
"A second graphics processor that can help draw games, videos, and other pictures." = "ゲーム、ビデオ、その他の画像の描画に役立つ 2 番目のグラフィック プロセッサ。"
"Captures video from a camera, television signal, or another video source." = "カメラ、テレビ信号、または別のビデオ ソースからビデオをキャプチャします。"
"An older sound card that plays and records sound." = "サウンドを再生および録音する古いサウンド カード。"
"Connects older devices through a serial port, one bit at a time." = "古いデバイスをシリアル ポート経由で一度に 1 ビットずつ接続します。"
"Connects older printers and other devices through a parallel port." = "パラレル ポート経由で古いプリンタやその他のデバイスを接続します。"
"Connects to the internet or another computer through a modem." = "モデムを介してインターネットまたは別のコンピュータに接続します。"
"Reads memory cards through an SD card slot." = "SD カード スロットを介してメモリ カードを読み取ります。"
"Connects older FireWire devices, such as cameras and storage drives." = "カメラやストレージ ドライブなどの古い FireWire デバイスを接続します。"
"Connects high-speed networks used by servers and other specialised computers." = "サーバーやその他の特殊なコンピューターで使用される高速ネットワークを接続します。"
"Connects devices through another type of serial bus." = "別のタイプのシリアル バスを介してデバイスを接続します。"
"Connects a wireless device that does not use a more specific wireless standard." = "より特殊な無線規格を使用しない無線デバイスを接続します。"
"Helps the computer manage power or improve performance." = "コンピューターの電力管理やパフォーマンスの向上に役立ちます。"
"A special-purpose device used to inspect or test the computer." = "コンピューターの検査またはテストに使用される専用のデバイス。"
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "ヘッドセット、マイク、オーディオ インターフェイスなどの USB 経由でサウンドを再生または録音します。"
"A network or modem connection over USB." = "USB 経由のネットワークまたはモデム接続。"
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "キーボード、マウス、ゲーム コントローラー、リモコンなどで、コンピューターを操作できるようにします。一部の照明や冷却機器もこの種類の接続を使います。"
"A camera or scanner that transfers pictures to the computer." = "画像をコンピュータに転送するカメラまたはスキャナ。"
"A printer connected by USB." = "USBで接続されたプリンター。"
"Stores files: a USB stick, card reader, or external drive." = "ファイルを保存: USB スティック、カード リーダー、または外部ドライブ。"
"Adds more USB ports by sharing one connection." = "1 つの接続を共有することで USB ポートを追加します。"
"Reads smart cards, like ID, bank, or security cards." = "ID、銀行カード、セキュリティ カードなどのスマート カードを読み取ります。"
"A webcam or video capture device." = "Web カメラまたはビデオ キャプチャ デバイス。"
"Connects a personal healthcare device, such as a blood pressure monitor." = "血圧計などの個人用ヘルスケア機器を接続します。"
"Plays or records sound and video over USB." = "USB 経由でサウンドとビデオを再生または録音します。"
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "USB-C ドックまたはアダプターがいずれかの接続モードを使用できないことを報告します。"
"A USB device used to inspect or test another device." = "別のデバイスの検査またはテストに使用される USB デバイス。"
"A USB device with a special purpose that does not fit another group." = "他のグループに当てはまらない特別な目的を持つ USB デバイス。"
"A USB device in firmware update mode." = "ファームウェア更新モードの USB デバイス。"
"A game controller (Xbox style)." = "ゲーム コントローラー (Xbox スタイル)。"
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "NZXT 水冷クーラーのポンプ、ファン、照明を制御します。"
"Controls the RGB lighting on your motherboard." = "マザーボード上の RGB 照明を制御します。"
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Logitech キーボードおよびマウス (Logi Bolt) 用のワイヤレス レシーバー。"
"Draws everything you see on your screen." = "画面上に表示されているものすべてを描画します。"
"Plays sound through your speakers or headphones, and records from microphones." = "スピーカーまたはヘッドフォンからサウンドを再生し、マイクから録音します。"
"Connects your computer to the internet and other computers." = "コンピュータをインターネットや他のコンピュータに接続します。"
"Stores your system, programs, and files, or connects the drives that do." = "システム、プログラム、ファイルを保存するか、保存するドライブを接続します。"
"Runs USB ports, so the things you plug in can talk to the computer." = "USB ポートを制御し、接続したものがコンピューターと通信できるようにします。"
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Thunderbolt と USB4 のポートを制御します。ドック、ドライブ、ディスプレイ向けのとても高速な接続です。"
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "キーボード、マウス、ゲーム コントローラーなどの機器で、コンピューターを操作できるようにします。"
"Captures video or pictures, like a webcam." = "ウェブカメラのようにビデオや写真をキャプチャします。"
"Prints or scans documents and photos." = "文書や写真を印刷またはスキャンします。"
"Sends data over older-style connections such as serial ports and modems." = "シリアル ポートやモデムなどの古いスタイルの接続を介してデータを送信します。"
"Handles encryption and protects secrets like passwords and disk keys." = "暗号化を処理し、パスワードやディスク キーなどの秘密を保護します。"
"Speeds up special kinds of work, such as AI tasks." = "AI タスクなどの特殊な種類の作業を高速化します。"
"Part of the processor, the computer's main brain." = "プロセッサーの一部です。プロセッサーはコンピューターの頭脳です。"
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "コンピューターの動作を維持するマザーボードの内蔵部品。通常はそれについて考える必要はありません。"
"A device that doesn't fit the usual groups." = "通常のグループには当てはまらないデバイスです。"
"Install the package that contains the missing firmware ({package}), then restart the computer." = "不足しているファームウェア ({package}) を含むパッケージをインストールし、コンピューターを再起動します。"
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "ドライバーにはファームウェア ファイル {file} が必要ですが、インストールされていません。ディストリビューションのパッケージでそのファイル名を検索し、そのパッケージをインストールしてから再起動してください。"
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "コンピューターを再起動してください。必要なファームウェアは現在インストールされていますが、起動時にはありませんでした。"
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "デバイスが時間内にドライバーに応答しませんでした。コンピューターを再起動してください。コンピューター内部のカードの場合は、スロットにしっかり差し込まれていること、電源ケーブル (ある場合) が接続されていることを確認してください。"
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "デバイスがエラーを返しました。コンピューターを再起動してください。繰り返し起きる場合は、デバイスまたは接続に問題がある可能性があります。可能であれば、別のポートやスロットを試してください。"
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "別のドライバーがすでにこのデバイスを使用している可能性があります。通常、コンピュータを再起動するとこの問題は解決します。"
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "ドライバーがデバイスを起動できませんでした。コンピューターを再起動してください。繰り返し起きる場合は、デバイスのハードウェア ID ({hardware_id}) と「Linux」を一緒にオンラインで検索してください。"
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "このデバイスのドライバー ({module}) はインストールされていますが、実行されていません。このコマンドで今すぐ開始してください。通常は再起動後に自動的に起動します。"
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "{module} ドライバーは {file} の設定でオフになっています。オンに戻すには、そのファイルから {module} を含む行を削除して再起動してください。このような設定は、別のグラフィックス ドライバーをインストールしたときなどに意図的に追加されることがあります。"
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "{module} ドライバーはブート設定 (カーネル コマンド ライン) でオフになっています。そこの blacklist オプションから「{module}」を削除して再起動してください。"
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "{module} ドライバーは動作していますが、このデバイスを使用していません。多くの場合、コンピューターを再起動すると直ります。直らない場合、理由は通常この上に表示されています。"
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "ドライバーは起動しましたが、デバイスの設定を完了できませんでした。コンピューターを再起動してください。それでも直らない場合、理由は通常この上に表示されています (多くはファームウェアの不足です)。"
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "このデバイスは USB セキュリティ設定 (USBGuard など) によってブロックされました。信頼できる場合は、その設定で許可してから、いったん抜いて差し直してください。"
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Logitech ワイヤレス マウスとキーボードをレシーバーとペアリングし、バッテリー レベルと設定を表示します。"
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "水冷クーラーや一部の電源の温度、ポンプとファンの速度を表示し、速度やライトを変更できます。"
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "コマンドライン プログラムです。Web サイトには各ディストリビューション向けのインストール手順があり、Python の pipx を使ってどこでも使える方法も載っています。"
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "マザーボード、メモリ、キーボード、ファンなど、多くのブランドの RGB デバイスのライトを 1 か所で制御します。"
"Your computer's working memory (RAM). Programs and the files you have open are kept here while you use them." = "コンピューターの作業用メモリー（RAM）です。使用中のプログラムや開いているファイルがここに保持されます。"
"A drive that stores your files, programs, and the operating system." = "ファイル、プログラム、オペレーティングシステムを保存するドライブです。"
"A screen that shows what the computer draws. Its resolution decides how sharp the picture is, and its refresh rate how smooth motion looks." = "コンピューターが描画した内容を表示する画面です。解像度で画像の鮮明さが、リフレッシュレートで動きの滑らかさが決まります。"
"The main circuit board that everything else plugs into, plus the BIOS, the small program that starts the computer." = "ほかのすべてを接続するメイン基板と、コンピューターを起動する小さなプログラムである BIOS です。"
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\"." = "このコンピューターにインストールされているドライバーは、このデバイスに対応していません。ハードウェア ID（{hardware_id}）と「Linux driver」を組み合わせてオンラインで検索してください。"
"Your distro offers a driver for it: the package {package}. Install it with this command, then restart the computer." = "お使いのディストリビューションにはこのデバイス用のドライバーがあります。パッケージ {package} です。このコマンドでインストールしてから、コンピューターを再起動してください。"
"The driver is in the \"{section}\" section of Debian's software sources, which is switched off on this computer, so installing it would fail with \"Unable to locate package\". Switch it on first with this command (it adds {section} to your software sources and refreshes the list), then scan again." = "このドライバーは Debian のソフトウェアソースの「{section}」セクションにありますが、このコンピューターではオフになっているため、インストールすると「Unable to locate package」で失敗します。先にこのコマンドでオンにして（ソフトウェアソースに {section} を追加し、一覧を更新します）、もう一度スキャンしてください。"
"Your distro doesn't include a driver for it, but the Arch User Repository has one: {package}. It is made by volunteers and built on your computer when you install it, so read its page and build file first. Install it with your AUR helper (such as yay or paru), then restart the computer." = "お使いのディストリビューションにはこのデバイス用のドライバーが含まれていませんが、Arch User Repository に {package} があります。ボランティアが作成したもので、インストール時にお使いのコンピューター上でビルドされるため、先にそのページとビルドファイルを読んでください。AUR ヘルパー（yay や paru など）でインストールしてから、コンピューターを再起動してください。"
"Your distro doesn't package a driver for it. The driver's project page explains how to install it by hand: {homepage}" = "お使いのディストリビューションにはこのデバイス用のドライバーパッケージがありません。手動でのインストール方法はドライバーのプロジェクトページに記載されています：{homepage}"
"Back up your important files now, then plan to replace this drive. A drive that reports this can stop working without warning." = "今すぐ大切なファイルをバックアップし、このドライブの交換を計画してください。このような報告をするドライブは、予告なく動作しなくなることがあります。"
"This is a Broadcom Wi-Fi card. Broadcom's own driver (called wl) makes it work, but Linux can't include it because it isn't open source." = "Broadcom 製の Wi-Fi カードです。Broadcom 独自のドライバー（wl）で動作しますが、オープンソースではないため Linux には含められません。"
"This is a Realtek USB Wi-Fi adapter. Kernels older than 6.14 have no driver for it, so a separate community-made one is needed." = "Realtek 製の USB Wi-Fi アダプターです。6.14 より前のカーネルにはこのデバイス用のドライバーがないため、コミュニティが作成した別のドライバーが必要です。"
"This is a Realtek 5 Gigabit network card. Kernels older than 6.13 have no driver for it, so Realtek's own one is needed." = "Realtek 製の 5 ギガビットネットワークカードです。6.13 より前のカーネルにはこのデバイス用のドライバーがないため、Realtek 独自のドライバーが必要です。"
