# Translations of the text in descriptions.toml and fixes.toml, language: nl.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "nl"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Je videokaart. Die tekent alles wat je op het scherm ziet en doet het zware werk in games en video's."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Stuurt geluid naar je luidsprekers, koptelefoon of monitor, en neemt geluid op van microfoons."
"Connects your computer to a network with a cable (wired Ethernet)." = "Verbindt je computer met een netwerk via een kabel (bekabeld ethernet)."
"Connects your computer to wireless networks (Wi-Fi)." = "Verbindt je computer met draadloze netwerken (wifi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Een snelle opslagschijf (een NVMe-SSD) met je systeem, programma's en bestanden."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Verbindt SATA-schijven, zoals harde schijven, SSD's en dvd-stations, met de computer."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Stuurt een groep USB-poorten aan, zodat de apparaten die je aansluit met de computer kunnen communiceren."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Stuurt USB4- en Thunderbolt-poorten aan: zeer snelle verbindingen voor docks, schijven en beeldschermen."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Een kleine interne verbinding die het moederbord gebruikt om sensoren uit te lezen, zoals temperaturen en ventilatorsnelheden, en om met het geheugen te communiceren."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Verbindt de processor met de rest van de computer. Het maakt deel uit van het moederbord en werkt zonder driver."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Verbindt langzamere onderdelen van het moederbord, zoals de firmwarechip en de ventilatorregeling."
"Links expansion slots and built-in devices to the processor." = "Koppelt uitbreidingsslots en ingebouwde apparaten aan de processor."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Zorgt dat apparaten geen geheugen kunnen lezen waar ze niet bij mogen. Wordt gebruikt voor beveiliging en voor virtuele machines."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Een beveiligingschip die versleuteling afhandelt en geheimen zoals wachtwoorden en schijfsleutels beschermt."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Een AI-accelerator (een neurale verwerkingseenheid) die AI-taken snel en efficiënt uitvoert."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Voegt bluetooth toe, voor draadloze koptelefoons, controllers, toetsenborden en meer."
"Connects older storage drives and other devices that use the SCSI standard." = "Verbindt oudere opslagschijven en andere apparaten die de SCSI-standaard gebruiken."
"Connects older hard drives and other storage devices that use the IDE standard." = "Verbindt oudere harde schijven en andere opslagapparaten die de IDE-standaard gebruiken."
"Combines several storage drives so they can work together for speed or protection." = "Combineert verschillende opslagschijven zodat ze kunnen samenwerken voor snelheid of bescherming."
"Connects storage drives that use the ATA standard." = "Verbindt opslagschijven die de ATA-standaard gebruiken."
"Connects storage drives that use the SAS standard." = "Verbindt opslagschijven die de SAS-standaard gebruiken."
"Connects a storage device that does not use a more specific standard." = "Verbindt een opslagapparaat dat geen specifiekere standaard gebruikt."
"A second graphics processor that can help draw games, videos, and other pictures." = "Een tweede grafische processor die kan helpen bij het tekenen van games, video's en andere afbeeldingen."
"Captures video from a camera, television signal, or another video source." = "Legt video vast van een camera, televisiesignaal of een andere videobron."
"An older sound card that plays and records sound." = "Een oudere geluidskaart die geluid afspeelt en opneemt."
"Connects older devices through a serial port, one bit at a time." = "Verbindt oudere apparaten via een seriële poort, bit voor bit."
"Connects older printers and other devices through a parallel port." = "Verbindt oudere printers en andere apparaten via een parallelle poort."
"Connects to the internet or another computer through a modem." = "Maakt verbinding met internet of een andere computer via een modem."
"Reads memory cards through an SD card slot." = "Leest geheugenkaarten via een SD-kaartsleuf."
"Connects older FireWire devices, such as cameras and storage drives." = "Verbindt oudere FireWire-apparaten, zoals camera's en opslagstations."
"Connects high-speed networks used by servers and other specialised computers." = "Verbindt hogesnelheidsnetwerken die worden gebruikt door servers en andere gespecialiseerde computers."
"Connects devices through another type of serial bus." = "Verbindt apparaten via een ander type seriële bus."
"Connects a wireless device that does not use a more specific wireless standard." = "Verbindt een draadloos apparaat dat geen specifiekere draadloze standaard gebruikt."
"Helps the computer manage power or improve performance." = "Helpt de computer het stroomverbruik te beheren of de prestaties te verbeteren."
"A special-purpose device used to inspect or test the computer." = "Een speciaal apparaat dat wordt gebruikt om de computer te inspecteren of te testen."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Speelt geluid af of neemt het op via USB, zoals een headset, microfoon of audio-interface."
"A network or modem connection over USB." = "Een netwerk- of modemverbinding via USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Hiermee bestuur je de computer, zoals een toetsenbord, muis, gamecontroller of afstandsbediening. Sommige verlichtings- en koelingsgadgets gebruiken dit soort verbinding ook."
"A camera or scanner that transfers pictures to the computer." = "Een camera of scanner die foto's naar de computer overbrengt."
"A printer connected by USB." = "Een printer aangesloten via USB."
"Stores files: a USB stick, card reader, or external drive." = "Slaat bestanden op: een USB-stick, kaartlezer of externe schijf."
"Adds more USB ports by sharing one connection." = "Voegt meer USB-poorten toe door één verbinding te delen."
"Reads smart cards, like ID, bank, or security cards." = "Leest smartcards, zoals ID-, bank- of beveiligingskaarten."
"A webcam or video capture device." = "Een webcam of video-opnameapparaat."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Verbindt een persoonlijk gezondheidsapparaat, zoals een bloeddrukmeter."
"Plays or records sound and video over USB." = "Speelt geluid en video af of neemt het op via USB."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Meldt dat een USB-C-dock of -adapter een van de verbindingsmodi niet kan gebruiken."
"A USB device used to inspect or test another device." = "Een USB-apparaat dat wordt gebruikt om een ander apparaat te inspecteren of te testen."
"A USB device with a special purpose that does not fit another group." = "Een USB-apparaat met een speciaal doel dat niet in een andere groep past."
"A USB device in firmware update mode." = "Een USB-apparaat in de firmware-updatemodus."
"A game controller (Xbox style)." = "Een gamecontroller (Xbox-stijl)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Regelt de pomp, ventilatoren en verlichting van een NZXT-waterkoeler."
"Controls the RGB lighting on your motherboard." = "Regelt de RGB-verlichting op je moederbord."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Een draadloze ontvanger voor Logitech-toetsenborden en muizen (Logi Bolt)."
"Draws everything you see on your screen." = "Tekent alles wat je op je scherm ziet."
"Plays sound through your speakers or headphones, and records from microphones." = "Speelt geluid af via je luidsprekers of koptelefoon, en neemt op via microfoons."
"Connects your computer to the internet and other computers." = "Verbindt je computer met internet en andere computers."
"Stores your system, programs, and files, or connects the drives that do." = "Bewaart je systeem, programma's en bestanden, of verbindt de schijven die dat doen."
"Runs USB ports, so the things you plug in can talk to the computer." = "Stuurt USB-poorten aan, zodat wat je aansluit met de computer kan communiceren."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Stuurt Thunderbolt- en USB4-poorten aan: zeer snelle verbindingen voor docks, schijven en beeldschermen."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Hiermee bestuur je de computer: toetsenborden, muizen, gamecontrollers en vergelijkbare apparaten."
"Captures video or pictures, like a webcam." = "Legt video of foto's vast, zoals een webcam."
"Prints or scans documents and photos." = "Drukt of scant documenten en foto's."
"Sends data over older-style connections such as serial ports and modems." = "Verzendt gegevens via oudere verbindingen, zoals seriële poorten en modems."
"Handles encryption and protects secrets like passwords and disk keys." = "Handelt versleuteling af en beschermt geheimen zoals wachtwoorden en schijfsleutels."
"Speeds up special kinds of work, such as AI tasks." = "Versnelt speciale soorten werk, zoals AI-taken."
"Part of the processor, the computer's main brain." = "Onderdeel van de processor, het brein van de computer."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Een ingebouwd onderdeel van je moederbord dat de computer draaiende houdt. Normaal hoef je er nooit over na te denken."
"A device that doesn't fit the usual groups." = "Een apparaat dat niet in de gebruikelijke groepen past."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Installeer het pakket dat de ontbrekende firmware bevat ({package}) en start de computer opnieuw op."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "De driver heeft het firmwarebestand {file} nodig, maar dat is niet geïnstalleerd. Zoek die bestandsnaam in de pakketten van je distributie, installeer het pakket en start daarna opnieuw op."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Start de computer opnieuw op. De benodigde firmware is nu geïnstalleerd, maar deze ontbrak toen de computer opstartte."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "Het apparaat gaf de driver niet op tijd antwoord. Start de computer opnieuw op. Als het een kaart in de computer is, controleer dan of die stevig in de sleuf zit en of de stroomkabel (als die er is) is aangesloten."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "Het apparaat antwoordde met fouten. Start de computer opnieuw op. Blijft het gebeuren, dan is het apparaat of de verbinding misschien defect: probeer een andere poort of sleuf als dat kan."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Misschien gebruikt een andere driver dit apparaat al. Opnieuw opstarten lost dit meestal op."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "De driver kon het apparaat niet starten. Start de computer opnieuw op. Blijft het gebeuren, zoek dan online naar de hardware-ID van het apparaat ({hardware_id}) samen met \"Linux\"."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Er is een driver voor dit apparaat ({module}) geïnstalleerd, maar die draait niet. Start hem nu met dit commando. Normaal start hij na een herstart vanzelf."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "De driver {module} is uitgezet door een instelling in {file}. Om hem weer aan te zetten verwijder je de regel met {module} uit dat bestand en start je opnieuw op. Zulke instellingen worden soms met opzet toegevoegd, bijvoorbeeld bij het installeren van een andere videodriver."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "De driver {module} is uitgezet in je opstartinstellingen (de kernel-opdrachtregel). Verwijder daar \"{module}\" uit de blacklist-optie en start opnieuw op."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "De driver {module} draait, maar heeft dit apparaat niet overgenomen. Opnieuw opstarten lost dit vaak op. Zo niet, dan staat de reden meestal hierboven."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "De driver is gestart, maar heeft het apparaat niet volledig ingesteld. Start de computer opnieuw op. Helpt dat niet, dan staat de reden meestal hierboven (vaak ontbrekende firmware)."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Dit apparaat is geblokkeerd door je USB-beveiligingsinstellingen (zoals USBGuard). Vertrouw je het, sta het dan toe in die instellingen, haal het eruit en sluit het opnieuw aan."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Koppelt draadloze Logitech-muizen en -toetsenborden aan hun ontvanger en toont hun batterijniveau en instellingen."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Toont de temperatuur en de pomp- en ventilatorsnelheden van waterkoelers en sommige voedingen, en laat je hun snelheden en verlichting aanpassen."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "Het is een opdrachtregelprogramma. De website heeft installatiestappen voor elke distributie, waaronder een die overal werkt via pipx van Python."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Bestuurt op één plek de verlichting van RGB-apparaten van vele merken, zoals moederborden, geheugen, toetsenborden en ventilatoren."
"Your computer's working memory (RAM). Programs and the files you have open are kept here while you use them." = "Het werkgeheugen (RAM) van je computer. Programma’s en de bestanden die je geopend hebt, worden hier bewaard terwijl je ze gebruikt."
"A drive that stores your files, programs, and the operating system." = "Een schijf die je bestanden, programma’s en het besturingssysteem opslaat."
"A screen that shows what the computer draws. Its resolution decides how sharp the picture is, and its refresh rate how smooth motion looks." = "Een scherm dat laat zien wat de computer tekent. De resolutie bepaalt hoe scherp het beeld is en de verversingssnelheid hoe vloeiend beweging eruitziet."
"The main circuit board that everything else plugs into, plus the BIOS, the small program that starts the computer." = "Het moederbord waar al het andere op aangesloten wordt, plus het BIOS, het kleine programma dat de computer opstart."
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\"." = "Geen enkel stuurprogramma op deze computer ondersteunt dit apparaat. Zoek online naar de hardware-ID ({hardware_id}) samen met \"Linux driver\"."
"Your distro offers a driver for it: the package {package}. Install it with this command, then restart the computer." = "Je distributie biedt hiervoor een stuurprogramma aan: het pakket {package}. Installeer het met deze opdracht en start de computer daarna opnieuw op."
"The driver is in the \"{section}\" section of Debian's software sources, which is switched off on this computer, so installing it would fail with \"Unable to locate package\". Switch it on first with this command (it adds {section} to your software sources and refreshes the list), then scan again." = "Het stuurprogramma staat in de sectie \"{section}\" van de softwarebronnen van Debian, die op deze computer uitstaat. Installeren zou daarom mislukken met \"Unable to locate package\". Zet de sectie eerst aan met deze opdracht (die voegt {section} toe aan je softwarebronnen en ververst de lijst) en scan daarna opnieuw."
"Your distro doesn't include a driver for it, but the Arch User Repository has one: {package}. It is made by volunteers and built on your computer when you install it, so read its page and build file first. Install it with your AUR helper (such as yay or paru), then restart the computer." = "Je distributie bevat hiervoor geen stuurprogramma, maar de Arch User Repository heeft er wel een: {package}. Het is gemaakt door vrijwilligers en wordt bij het installeren op je computer gebouwd, dus lees eerst de bijbehorende pagina en het buildbestand. Installeer het met je AUR-helper (zoals yay of paru) en start de computer daarna opnieuw op."
"Your distro doesn't package a driver for it. The driver's project page explains how to install it by hand: {homepage}" = "Je distributie levert hiervoor geen stuurprogrammapakket. Op de projectpagina van het stuurprogramma staat hoe je het met de hand installeert: {homepage}"
"Back up your important files now, then plan to replace this drive. A drive that reports this can stop working without warning." = "Maak nu een back-up van je belangrijke bestanden en plan in om deze schijf te vervangen. Een schijf die dit meldt, kan zonder waarschuwing uitvallen."
"This is a Broadcom Wi-Fi card. Broadcom's own driver (called wl) makes it work, but Linux can't include it because it isn't open source." = "Dit is een Broadcom-wifikaart. Het eigen stuurprogramma van Broadcom (wl genoemd) laat hem werken, maar Linux kan het niet meeleveren omdat het geen open source is."
"This is a Realtek USB Wi-Fi adapter. Kernels older than 6.14 have no driver for it, so a separate community-made one is needed." = "Dit is een Realtek-usb-wifiadapter. Kernels ouder dan 6.14 hebben er geen stuurprogramma voor, dus er is een apart door de community gemaakt stuurprogramma nodig."
"This is a Realtek 5 Gigabit network card. Kernels older than 6.13 have no driver for it, so Realtek's own one is needed." = "Dit is een Realtek-netwerkkaart van 5 gigabit. Kernels ouder dan 6.13 hebben er geen stuurprogramma voor, dus het eigen stuurprogramma van Realtek is nodig."
