# Translations of the text in descriptions.toml and fixes.toml, language: tr.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "tr"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Grafik kartınız. Ekranda gördüğünüz her şeyi çizer ve oyunlarda ve videolarda işin ağır yükünü üstlenir."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Hoparlörlerinize, kulaklığınıza veya monitörünüze ses gönderir ve mikrofonlardan ses alır."
"Connects your computer to a network with a cable (wired Ethernet)." = "Bilgisayarınızı bir kabloyla (kablolu Ethernet) bir ağa bağlar."
"Connects your computer to wireless networks (Wi-Fi)." = "Bilgisayarınızı kablosuz ağlara (Wi-Fi) bağlar."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Sisteminizi, programlarınızı ve dosyalarınızı barındıran hızlı bir depolama sürücüsü (NVMe SSD)."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Sabit sürücüler, SSD'ler ve DVD sürücüleri gibi SATA sürücülerini bilgisayara bağlar."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Bir grup USB bağlantı noktasını yönetir, böylece taktığınız cihazlar bilgisayarla iletişim kurabilir."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "USB4 ve Thunderbolt bağlantı noktalarını yönetir: yerleştirme istasyonları, sürücüler ve ekranlar için çok hızlı bağlantılar."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Anakartın sıcaklık ve fan hızları gibi sensörleri okumak ve bellekle iletişim kurmak için kullandığı küçük bir dahili bağlantı."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "İşlemciyi bilgisayarın geri kalanına bağlar. Anakartın bir parçasıdır ve sürücüsüz çalışır."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Ürün yazılımı çipi ve fan kontrolleri gibi anakartın daha yavaş parçalarını bağlar."
"Links expansion slots and built-in devices to the processor." = "Genişletme yuvalarını ve yerleşik aygıtları işlemciye bağlar."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Cihazların erişmemesi gereken belleği okumasını engeller. Güvenlik ve sanal makineler için kullanılır."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Şifrelemeyi yöneten ve parolalar ve disk anahtarları gibi sırları koruyan bir güvenlik yongası."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Yapay zeka görevlerini hızlı ve verimli bir şekilde çalıştıran bir yapay zeka hızlandırıcısı (nöral işlem birimi)."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Kablosuz kulaklıklar, kumandalar, klavyeler ve daha fazlası için Bluetooth ekler."
"Connects older storage drives and other devices that use the SCSI standard." = "SCSI standardını kullanan eski depolama sürücülerini ve diğer cihazları bağlar."
"Connects older hard drives and other storage devices that use the IDE standard." = "IDE standardını kullanan eski sabit sürücüleri ve diğer depolama aygıtlarını bağlar."
"Combines several storage drives so they can work together for speed or protection." = "Hız veya koruma amacıyla birlikte çalışabilmeleri için birkaç depolama sürücüsünü birleştirir."
"Connects storage drives that use the ATA standard." = "ATA standardını kullanan depolama sürücülerini bağlar."
"Connects storage drives that use the SAS standard." = "SAS standardını kullanan depolama sürücülerini bağlar."
"Connects a storage device that does not use a more specific standard." = "Daha spesifik bir standart kullanmayan bir depolama cihazını bağlar."
"A second graphics processor that can help draw games, videos, and other pictures." = "Oyunların, videoların ve diğer resimlerin çizilmesine yardımcı olabilecek ikinci bir grafik işlemci."
"Captures video from a camera, television signal, or another video source." = "Bir kameradan, televizyon sinyalinden veya başka bir video kaynağından video çeker."
"An older sound card that plays and records sound." = "Sesi çalan ve kaydeden eski bir ses kartı."
"Connects older devices through a serial port, one bit at a time." = "Eski cihazları seri port üzerinden, her seferinde bir bit olmak üzere bağlar."
"Connects older printers and other devices through a parallel port." = "Eski yazıcıları ve diğer cihazları paralel bir bağlantı noktası üzerinden bağlar."
"Connects to the internet or another computer through a modem." = "Modem aracılığıyla internete veya başka bir bilgisayara bağlanır."
"Reads memory cards through an SD card slot." = "Hafıza kartlarını bir SD kart yuvası aracılığıyla okur."
"Connects older FireWire devices, such as cameras and storage drives." = "Kameralar ve depolama sürücüleri gibi eski FireWire cihazlarını bağlar."
"Connects high-speed networks used by servers and other specialised computers." = "Sunucular ve diğer özel bilgisayarlar tarafından kullanılan yüksek hızlı ağları birbirine bağlar."
"Connects devices through another type of serial bus." = "Cihazları başka türde bir seri veri yolu üzerinden bağlar."
"Connects a wireless device that does not use a more specific wireless standard." = "Daha spesifik bir kablosuz standart kullanmayan bir kablosuz aygıtı bağlar."
"Helps the computer manage power or improve performance." = "Bilgisayarın gücü yönetmesine veya performansı artırmasına yardımcı olur."
"A special-purpose device used to inspect or test the computer." = "Bilgisayarı incelemek veya test etmek için kullanılan özel amaçlı bir cihaz."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Kulaklık, mikrofon veya ses arabirimi gibi USB üzerinden sesi çalar veya kaydeder."
"A network or modem connection over USB." = "USB üzerinden ağ veya modem bağlantısı."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Bilgisayarı klavye, fare, oyun kumandası veya uzaktan kumanda gibi kontrol etmenizi sağlar. Bazı aydınlatma ve soğutma cihazları da bu tür bir bağlantıyı kullanır."
"A camera or scanner that transfers pictures to the computer." = "Resimleri bilgisayara aktaran bir kamera veya tarayıcı."
"A printer connected by USB." = "USB ile bağlanan bir yazıcı."
"Stores files: a USB stick, card reader, or external drive." = "Dosyaları depolar: bir USB bellek, kart okuyucu veya harici sürücü."
"Adds more USB ports by sharing one connection." = "Bir bağlantıyı paylaşarak daha fazla USB bağlantı noktası ekler."
"Reads smart cards, like ID, bank, or security cards." = "Kimlik, banka veya güvenlik kartları gibi akıllı kartları okur."
"A webcam or video capture device." = "Bir web kamerası veya video yakalama cihazı."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Kan basıncı monitörü gibi kişisel bir sağlık cihazını bağlar."
"Plays or records sound and video over USB." = "USB üzerinden ses ve videoyu oynatır veya kaydeder."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "USB-C bağlantı istasyonunun veya adaptörünün bağlantı modlarından birini kullanamadığını bildirir."
"A USB device used to inspect or test another device." = "Başka bir cihazı incelemek veya test etmek için kullanılan bir USB cihazı."
"A USB device with a special purpose that does not fit another group." = "Başka bir gruba uymayan, özel amaçlı bir USB cihazı."
"A USB device in firmware update mode." = "Ürün yazılımı güncelleme modunda bir USB cihazı."
"A game controller (Xbox style)." = "Bir oyun kumandası (Xbox stili)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "NZXT sıvı soğutucunun pompasını, fanlarını ve aydınlatmasını kontrol eder."
"Controls the RGB lighting on your motherboard." = "Anakartınızdaki RGB aydınlatmayı kontrol eder."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Logitech klavyeleri ve fareleri için kablosuz alıcı (Logi Bolt)."
"Draws everything you see on your screen." = "Ekranınızda gördüğünüz her şeyi çizer."
"Plays sound through your speakers or headphones, and records from microphones." = "Sesi hoparlörlerinizden veya kulaklığınızdan çalar ve mikrofonlardan kaydeder."
"Connects your computer to the internet and other computers." = "Bilgisayarınızı internete ve diğer bilgisayarlara bağlar."
"Stores your system, programs, and files, or connects the drives that do." = "Sisteminizi, programlarınızı ve dosyalarınızı saklar veya bunları saklayan sürücüleri bağlar."
"Runs USB ports, so the things you plug in can talk to the computer." = "USB bağlantı noktalarını yönetir, böylece taktığınız şeyler bilgisayarla iletişim kurabilir."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Thunderbolt ve USB4 bağlantı noktalarını yönetir: yerleştirme istasyonları, sürücüler ve ekranlar için çok hızlı bağlantılar."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Bilgisayarı kontrol etmenizi sağlar: klavyeler, fareler, oyun kumandaları ve benzeri cihazlar."
"Captures video or pictures, like a webcam." = "Web kamerası gibi video veya resim çeker."
"Prints or scans documents and photos." = "Belgeleri ve fotoğrafları yazdırır veya tarar."
"Sends data over older-style connections such as serial ports and modems." = "Verileri seri bağlantı noktaları ve modemler gibi eski tarz bağlantılar üzerinden gönderir."
"Handles encryption and protects secrets like passwords and disk keys." = "Şifrelemeyi yönetir ve parolalar ve disk anahtarları gibi sırları korur."
"Speeds up special kinds of work, such as AI tasks." = "Yapay zeka görevleri gibi özel iş türlerini hızlandırır."
"Part of the processor, the computer's main brain." = "İşlemcinin bir parçası, bilgisayarın beyni."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Anakartınızın bilgisayarın çalışmasını sağlayan yerleşik bir parçası. Normalde bunu asla düşünmenize gerek yoktur."
"A device that doesn't fit the usual groups." = "Alışılmış gruplara uymayan bir cihaz."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Eksik ürün yazılımını ({package}) içeren paketi yükleyin ve ardından bilgisayarı yeniden başlatın."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "Sürücünün, yüklü olmayan {file} ürün yazılımı dosyasına ihtiyacı var. Dağıtımınızın paketlerinde bu dosya adını arayın, paketi yükleyin ve yeniden başlatın."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Bilgisayarı yeniden başlatın. İhtiyaç duyduğu ürün yazılımı şu anda yüklü, ancak bilgisayar başlatıldığında eksikti."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "Cihaz sürücüye zamanında yanıt vermedi. Bilgisayarı yeniden başlatın. Bilgisayarın içindeki bir kartsa, yuvasına sıkıca itildiğinden ve güç kablosunun (varsa) bağlı olduğundan emin olun."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "Cihaz hatalarla yanıt verdi. Bilgisayarı yeniden başlatın. Bu durum sürekli oluyorsa cihaz veya bağlantısı arızalı olabilir: imkânınız varsa başka bir bağlantı noktası veya yuva deneyin."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Başka bir sürücü bu aygıtı zaten kullanıyor olabilir. Bilgisayarı yeniden başlatmak genellikle bu sorunu çözer."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "Sürücü cihazı başlatamadı. Bilgisayarı yeniden başlatın. Bu durum devam ederse, cihazın donanım kimliğini ({hardware_id}) \"Linux\" ile birlikte çevrimiçi olarak arayın."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Bu aygıt için bir sürücü ({module}) yüklü ancak çalışmıyor. Şimdi bu komutla başlatın. Normalde yeniden başlatmanın ardından kendiliğinden başlar."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "{module} sürücüsü, {file} dosyasındaki bir ayarla kapatılmış. Tekrar açmak için bu dosyadan {module} geçen satırı silin ve yeniden başlatın. Bu tür ayarlar bazen bilerek eklenir, örneğin başka bir grafik sürücüsü kurulurken."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "{module} sürücüsü, önyükleme ayarlarınızda (çekirdek komut satırı) kapatılmış. Oradaki blacklist seçeneğinden \"{module}\" değerini kaldırın ve yeniden başlatın."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "{module} sürücüsü çalışıyor ancak bu cihazı üstlenmedi. Bilgisayarı yeniden başlatmak çoğu zaman bu sorunu çözer. Çözmezse, nedeni genellikle yukarıda gösterilir."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "Sürücü başladı ancak aygıtın kurulumunu tamamlamadı. Bilgisayarı yeniden başlatın. Bu işe yaramazsa, nedeni genellikle yukarıda gösterilir (genellikle ürün yazılımı eksiktir)."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Bu cihaz, USB güvenlik ayarlarınız (USBGuard gibi) tarafından engellendi. Güveniyorsanız bu ayarlarda izin verin, ardından fişini çekip tekrar takın."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Logitech kablosuz fare ve klavyelerini alıcılarıyla eşleştirir ve pil seviyelerini ve ayarlarını gösterir."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Sıvı soğutucuların ve bazı güç kaynaklarının sıcaklığını, pompa ve fan hızlarını gösterir ve hızlarını ve ışıklarını değiştirmenize olanak tanır."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "Bu bir komut satırı programıdır. Web sitesinde her dağıtım için kurulum adımları bulunur; bunlardan biri Python'un pipx aracıyla her yerde çalışır."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Anakart, bellek, klavye ve fan gibi birçok markanın RGB cihazlarının ışıklarını tek yerden kontrol eder."
"Your computer's working memory (RAM). Programs and the files you have open are kept here while you use them." = "Bilgisayarınızın çalışma belleği (RAM). Kullandığınız programlar ve açık dosyalarınız siz kullanırken burada tutulur."
"A drive that stores your files, programs, and the operating system." = "Dosyalarınızı, programlarınızı ve işletim sistemini depolayan bir sürücü."
"A screen that shows what the computer draws. Its resolution decides how sharp the picture is, and its refresh rate how smooth motion looks." = "Bilgisayarın çizdiklerini gösteren bir ekran. Çözünürlüğü görüntünün ne kadar net olduğunu, yenileme hızı ise hareketin ne kadar akıcı göründüğünü belirler."
"The main circuit board that everything else plugs into, plus the BIOS, the small program that starts the computer." = "Diğer her şeyin takıldığı ana kart ve bilgisayarı başlatan küçük program olan BIOS."
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\"." = "Bu bilgisayarda kurulu hiçbir sürücü bu cihazı desteklemiyor. Cihazın donanım kimliğini ({hardware_id}) \"Linux driver\" ile birlikte internette aratın."
"Your distro offers a driver for it: the package {package}. Install it with this command, then restart the computer." = "Dağıtımınız bunun için bir sürücü sunuyor: {package} paketi. Bu komutla kurun, ardından bilgisayarı yeniden başlatın."
"The driver is in the \"{section}\" section of Debian's software sources, which is switched off on this computer, so installing it would fail with \"Unable to locate package\". Switch it on first with this command (it adds {section} to your software sources and refreshes the list), then scan again." = "Sürücü, Debian'ın yazılım kaynaklarının bu bilgisayarda kapalı olan \"{section}\" bölümünde bulunuyor; bu yüzden kurulum \"Unable to locate package\" hatasıyla başarısız olur. Önce bu komutla açın (yazılım kaynaklarınıza {section} ekler ve listeyi yeniler), sonra yeniden tarayın."
"Your distro doesn't include a driver for it, but the Arch User Repository has one: {package}. It is made by volunteers and built on your computer when you install it, so read its page and build file first. Install it with your AUR helper (such as yay or paru), then restart the computer." = "Dağıtımınız bunun için bir sürücü içermiyor, ancak Arch User Repository'de bir tane var: {package}. Gönüllüler tarafından hazırlanır ve kurulum sırasında bilgisayarınızda derlenir; bu yüzden önce sayfasını ve derleme dosyasını okuyun. AUR yardımcınızla (yay veya paru gibi) kurun, ardından bilgisayarı yeniden başlatın."
"Your distro doesn't package a driver for it. The driver's project page explains how to install it by hand: {homepage}" = "Dağıtımınız bunun için bir sürücü paketi sunmuyor. Sürücünün proje sayfasında elle nasıl kurulacağı anlatılıyor: {homepage}"
"Back up your important files now, then plan to replace this drive. A drive that reports this can stop working without warning." = "Önemli dosyalarınızı hemen yedekleyin, ardından bu sürücüyü değiştirmeyi planlayın. Bunu bildiren bir sürücü uyarı vermeden çalışmayı bırakabilir."
"This is a Broadcom Wi-Fi card. Broadcom's own driver (called wl) makes it work, but Linux can't include it because it isn't open source." = "Bu bir Broadcom Wi-Fi kartı. Broadcom'un kendi sürücüsü (wl olarak adlandırılır) çalışmasını sağlar, ancak açık kaynak olmadığı için Linux bunu içeremez."
"This is a Realtek USB Wi-Fi adapter. Kernels older than 6.14 have no driver for it, so a separate community-made one is needed." = "Bu bir Realtek USB Wi-Fi adaptörü. 6.14'ten eski çekirdeklerde bunun için sürücü yoktur; bu yüzden topluluk tarafından yapılmış ayrı bir sürücü gerekir."
"This is a Realtek 5 Gigabit network card. Kernels older than 6.13 have no driver for it, so Realtek's own one is needed." = "Bu bir Realtek 5 Gigabit ağ kartı. 6.13'ten eski çekirdeklerde bunun için sürücü yoktur; bu yüzden Realtek'in kendi sürücüsü gerekir."
