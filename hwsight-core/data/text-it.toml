# Translations of the text in descriptions.toml and fixes.toml, language: it.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "it"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "La tua scheda grafica. Disegna tutto ciò che vedi sullo schermo e fa il lavoro pesante nei giochi e nei video."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Invia l'audio agli altoparlanti, alle cuffie o al monitor e riceve l'audio dai microfoni."
"Connects your computer to a network with a cable (wired Ethernet)." = "Collega il computer a una rete tramite un cavo (Ethernet cablato)."
"Connects your computer to wireless networks (Wi-Fi)." = "Connette il computer alle reti wireless (Wi-Fi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Un'unità di archiviazione veloce (un SSD NVMe) che contiene sistema, programmi e file."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Collega le unità SATA, come dischi rigidi, SSD e unità DVD, al computer."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Gestisce un gruppo di porte USB, in modo che i dispositivi collegati possano comunicare con il computer."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Gestisce le porte USB4 e Thunderbolt: connessioni molto veloci per dock, unità e schermi."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Una piccola connessione interna che la scheda madre usa per leggere i sensori, come temperature e velocità delle ventole, e per comunicare con la memoria."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Collega il processore al resto del computer. Fa parte della scheda madre e funziona senza driver."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Collega le parti più lente della scheda madre, come il chip del firmware e i controlli delle ventole."
"Links expansion slots and built-in devices to the processor." = "Collega gli slot di espansione e i dispositivi integrati al processore."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Impedisce ai dispositivi di leggere memoria a cui non devono accedere. Serve per la sicurezza e per le macchine virtuali."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Un chip di sicurezza che gestisce la crittografia e protegge i segreti come password e chiavi del disco."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Un acceleratore AI (un'unità di elaborazione neurale) che esegue le attività AI in modo rapido ed efficiente."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Aggiunge Bluetooth, per cuffie wireless, controller, tastiere e altro ancora."
"Connects older storage drives and other devices that use the SCSI standard." = "Collega unità di archiviazione meno recenti e altri dispositivi che utilizzano lo standard SCSI."
"Connects older hard drives and other storage devices that use the IDE standard." = "Collega i dischi rigidi più vecchi e altri dispositivi di archiviazione che utilizzano lo standard IDE."
"Combines several storage drives so they can work together for speed or protection." = "Combina diverse unità di archiviazione in modo che possano lavorare insieme per garantire velocità o protezione."
"Connects storage drives that use the ATA standard." = "Collega le unità di archiviazione che utilizzano lo standard ATA."
"Connects storage drives that use the SAS standard." = "Collega le unità di archiviazione che utilizzano lo standard SAS."
"Connects a storage device that does not use a more specific standard." = "Collega un dispositivo di archiviazione che non utilizza uno standard più specifico."
"A second graphics processor that can help draw games, videos, and other pictures." = "Un secondo processore grafico che può aiutare a disegnare giochi, video e altre immagini."
"Captures video from a camera, television signal, or another video source." = "Cattura video da una fotocamera, un segnale televisivo o un'altra sorgente video."
"An older sound card that plays and records sound." = "Una vecchia scheda audio che riproduce e registra l'audio."
"Connects older devices through a serial port, one bit at a time." = "Collega i dispositivi più vecchi tramite una porta seriale, un bit alla volta."
"Connects older printers and other devices through a parallel port." = "Collega stampanti più vecchie e altri dispositivi tramite una porta parallela."
"Connects to the internet or another computer through a modem." = "Si connette a Internet o a un altro computer tramite un modem."
"Reads memory cards through an SD card slot." = "Legge le schede di memoria attraverso uno slot per schede SD."
"Connects older FireWire devices, such as cameras and storage drives." = "Collega i dispositivi FireWire meno recenti, come fotocamere e unità di archiviazione."
"Connects high-speed networks used by servers and other specialised computers." = "Connette reti ad alta velocità utilizzate da server e altri computer specializzati."
"Connects devices through another type of serial bus." = "Collega i dispositivi tramite un altro tipo di bus seriale."
"Connects a wireless device that does not use a more specific wireless standard." = "Connette un dispositivo wireless che non utilizza uno standard wireless più specifico."
"Helps the computer manage power or improve performance." = "Aiuta il computer a gestire l'energia o a migliorare le prestazioni."
"A special-purpose device used to inspect or test the computer." = "Un dispositivo speciale utilizzato per ispezionare o testare il computer."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Riproduce o registra l'audio tramite USB, come un auricolare, un microfono o un'interfaccia audio."
"A network or modem connection over USB." = "Una connessione di rete o modem tramite USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Ti consente di controllare il computer, ad esempio una tastiera, un mouse, un controller di gioco o un telecomando. Anche alcuni gadget di illuminazione e raffreddamento utilizzano questo tipo di connessione."
"A camera or scanner that transfers pictures to the computer." = "Una fotocamera o uno scanner che trasferisce le immagini al computer."
"A printer connected by USB." = "Una stampante collegata tramite USB."
"Stores files: a USB stick, card reader, or external drive." = "Memorizza file: una chiavetta USB, un lettore di schede o un'unità esterna."
"Adds more USB ports by sharing one connection." = "Aggiunge più porte USB condividendo una connessione."
"Reads smart cards, like ID, bank, or security cards." = "Legge le smart card, come carte d'identità, carte bancarie o di sicurezza."
"A webcam or video capture device." = "Una webcam o un dispositivo di acquisizione video."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Collega un dispositivo sanitario personale, come un misuratore di pressione sanguigna."
"Plays or records sound and video over USB." = "Riproduce o registra audio e video tramite USB."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Segnala che un dock o un adattatore USB-C non può utilizzare una delle sue modalità di connessione."
"A USB device used to inspect or test another device." = "Un dispositivo USB utilizzato per ispezionare o testare un altro dispositivo."
"A USB device with a special purpose that does not fit another group." = "Un dispositivo USB con uno scopo speciale che non rientra in un altro gruppo."
"A USB device in firmware update mode." = "Un dispositivo USB in modalità di aggiornamento del firmware."
"A game controller (Xbox style)." = "Un controller di gioco (stile Xbox)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Controlla la pompa, le ventole e l’illuminazione di un sistema di raffreddamento a liquido NZXT."
"Controls the RGB lighting on your motherboard." = "Controlla l'illuminazione RGB sulla scheda madre."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Un ricevitore wireless per tastiere e mouse Logitech (Logi Bolt)."
"Draws everything you see on your screen." = "Disegna tutto ciò che vedi sullo schermo."
"Plays sound through your speakers or headphones, and records from microphones." = "Riproduce l'audio tramite gli altoparlanti o le cuffie e registra dai microfoni."
"Connects your computer to the internet and other computers." = "Connette il tuo computer a Internet e ad altri computer."
"Stores your system, programs, and files, or connects the drives that do." = "Contiene il tuo sistema, i programmi e i file, o collega le unità che li contengono."
"Runs USB ports, so the things you plug in can talk to the computer." = "Gestisce le porte USB, così ciò che colleghi può comunicare con il computer."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Gestisce le porte Thunderbolt e USB4: connessioni molto veloci per dock, unità e schermi."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Ti consente di controllare il computer: tastiere, mouse, controller di gioco e dispositivi simili."
"Captures video or pictures, like a webcam." = "Cattura video o immagini, come una webcam."
"Prints or scans documents and photos." = "Stampa o esegue la scansione di documenti e foto."
"Sends data over older-style connections such as serial ports and modems." = "Invia dati tramite connessioni di vecchio stile come porte seriali e modem."
"Handles encryption and protects secrets like passwords and disk keys." = "Gestisce la crittografia e protegge i segreti come password e chiavi del disco."
"Speeds up special kinds of work, such as AI tasks." = "Accelera tipi speciali di lavoro, come le attività di intelligenza artificiale."
"Part of the processor, the computer's main brain." = "Parte del processore, il cervello del computer."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Una parte integrata della scheda madre che mantiene il computer in funzione. Normalmente non hai mai bisogno di pensarci."
"A device that doesn't fit the usual groups." = "Un dispositivo che non rientra nei gruppi abituali."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Installa il pacchetto che contiene il firmware mancante ({package}), quindi riavvia il computer."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "Il driver ha bisogno del file firmware {file}, che non è installato. Cerca quel nome di file nei pacchetti della tua distribuzione, installa il pacchetto, quindi riavvia."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Riavvia il computer. Il firmware necessario ora è installato, ma mancava all’avvio del computer."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "Il dispositivo non ha risposto in tempo al driver. Riavvia il computer. Se è una scheda all’interno del computer, controlla che sia inserita bene nel suo slot e che il cavo di alimentazione (se c’è) sia collegato."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "Il dispositivo ha risposto con errori. Riavvia il computer. Se il problema persiste, il dispositivo o la sua connessione potrebbero essere difettosi: prova un’altra porta o un altro slot, se puoi."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Un altro driver potrebbe già usare questo dispositivo. Di solito riavviare il computer risolve il problema."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "Il driver non è riuscito ad avviare il dispositivo. Riavvia il computer. Se il problema persiste, cerca online l’ID hardware del dispositivo ({hardware_id}) insieme a \"Linux\"."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Un driver per questo dispositivo ({module}) è installato ma non è in esecuzione. Avvialo ora con questo comando. Normalmente si avvia da solo dopo un riavvio."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "Il driver {module} viene disattivato da un'impostazione in {file}. Per riattivarlo, rimuovi la riga che menziona {module} da quel file, quindi riavvia. Impostazioni come questa a volte vengono aggiunte di proposito, ad esempio quando si installa un altro driver grafico."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "Il driver {module} è disattivato nelle impostazioni di avvio (la riga di comando del kernel). Rimuovi \"{module}\" dall'opzione della lista nera, quindi riavvia."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "Il driver {module} è in esecuzione, ma non ha preso questo dispositivo. Spesso riavviare il computer risolve il problema. Altrimenti, il motivo di solito è indicato sopra."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "Il driver si è avviato, ma non ha finito di configurare il dispositivo. Riavvia il computer. Se non basta, il motivo di solito è indicato sopra (spesso manca il firmware)."
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\". A later version of hwsight will suggest driver packages for many devices." = "Nessun driver installato su questo computer supporta questo dispositivo. Cerca online il suo ID hardware ({hardware_id}) insieme a \"driver Linux\". Una versione futura di hwsight suggerirà pacchetti di driver per molti dispositivi."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Questo dispositivo è stato bloccato dalle impostazioni di sicurezza USB (come USBGuard). Se ti fidi, consentilo in quelle impostazioni, quindi scollegalo e ricollegalo."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Associa mouse e tastiere wireless Logitech al loro ricevitore e mostra il livello della batteria e le impostazioni."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Mostra la temperatura e la velocità della pompa e delle ventole dei sistemi di raffreddamento a liquido e di alcuni alimentatori, e ti permette di cambiarne velocità e luci."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "È un programma a riga di comando. Il suo sito contiene i passaggi di installazione per ogni distribuzione, incluso uno che funziona ovunque tramite pipx di Python."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Controlla le luci sui dispositivi RGB di molte marche in un unico posto, come schede madri, memoria, tastiere e ventole."
