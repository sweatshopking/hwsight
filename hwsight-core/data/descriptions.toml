# What each kind of device does, in plain English, for people who aren't technical.
#
# Built into hwsight and replaceable by a newer downloaded copy. `schema` is the file
# format version; `version` is the data release date (YYYY.MM.DD), newest wins.
#
# hwsight picks the most specific [[describe]] entry that matches a device (an exact
# vendor and device beats a protocol, which beats a subclass, which beats a class). USB
# devices are matched by the kinds of connection ("interfaces") they offer. If nothing
# matches, the [category] text is used, so every device gets a description.
#
# Match fields (all optional, hex without "0x"): bus ("pci" or "usb", default "pci"),
# class, subclasses, prog_ifs, vendor, device. Same meaning as in rules.toml.
#
# Writing style: one or two short sentences, starting with what it's for in everyday
# terms. No jargon unless it's explained, no brand names, no emoji.
schema = 1
version = "2026.11.04"

# Fallbacks, one per category (keys match hwsight's categories).
[category]
graphics = "Draws everything you see on your screen."
sound = "Plays sound through your speakers or headphones, and records from microphones."
network = "Connects your computer to the internet and other computers."
bluetooth = "Adds Bluetooth, for wireless headphones, controllers, keyboards, and more."
storage = "Stores your system, programs, and files, or connects the drives that do."
usb_controllers = "Runs USB ports, so the things you plug in can talk to the computer."
thunderbolt = "Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays."
input = "Lets you control the computer: keyboards, mice, game controllers, and similar devices."
camera = "Captures video or pictures, like a webcam."
printers = "Prints or scans documents and photos."
communication = "Sends data over older-style connections such as serial ports and modems."
security = "Handles encryption and protects secrets like passwords and disk keys."
accelerators = "Speeds up special kinds of work, such as AI tasks."
processors = "Part of the processor, the computer's main brain."
memory = "Your computer's working memory (RAM). Programs and the files you have open are kept here while you use them."
motherboard = "The main circuit board that everything else plugs into, plus the BIOS, the small program that starts the computer."
system_devices = "A built-in part of your motherboard that keeps the computer running. You normally never need to think about it."
other = "A device that doesn't fit the usual groups."

