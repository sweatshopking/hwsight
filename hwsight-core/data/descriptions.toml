# Xbox-style game controllers report a vendor-specific type: 5d is the Xbox 360 style,
# 47 the Xbox One style. This covers the many third-party pads that copy them.
[[describe]]
bus = "usb"
class = "ff"
subclasses = ["5d", "47"]
text = "A game controller (Xbox style)."

