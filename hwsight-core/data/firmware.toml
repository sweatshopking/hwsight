# Which package provides a firmware file, per distro family.
#
# Built into hwsight and replaceable by a newer downloaded copy. `schema` is the file
# format version; `version` is the data release date (YYYY.MM.DD), newest wins.
#
# Each [[firmware]] entry matches firmware paths starting with `path` (a folder like
# "rtl_nic/" or a file prefix like "iwlwifi-"). The longest matching path that has an
# entry for the user's distro wins, so the `path = ""` entry is the fallback.
# Family keys: arch, debian, ubuntu, fedora, opensuse. Where names differ between
# releases, add a release key: `debian-bookworm`, `ubuntu-noble` (base codename, so Linux
# Mint 22 uses ubuntu-noble), `fedora-43`. A release key beats the plain family key in
# the same entry. Unknown keys are ignored, so data can add a family or release before
# the app knows it. Generic `debian` names follow the current stable release (trixie).
# The value "none" means that release doesn't package this firmware at all, so hwsight
# suggests nothing rather than a package that doesn't exist.
#
# Verification: tools/verify-firmware.py checks every entry against real packages in
# containers (Debian 12 and 13, Ubuntu 22.04 and 24.04, Fedora, openSUSE Tumbleweed).
# Arch was checked with pacman -Qo. Run the tool after every change.
schema = 1
version = "2026.11.02"

[notes]
debian = "Debian keeps most firmware in the \"non-free-firmware\" section. It must be turned on in your software sources before these packages can be installed."

# Fallback for anything not listed below.
[[firmware]]
path = ""
arch = "linux-firmware"
ubuntu = "linux-firmware"
debian = "firmware-misc-nonfree"
fedora = "linux-firmware"
opensuse = "kernel-firmware-all"

