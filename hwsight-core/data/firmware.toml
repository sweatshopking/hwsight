# Which package provides a firmware file, per distro family.
#
# Built into hwsight and replaceable by a newer downloaded copy. `schema` is the file
# format version; `version` is the data release date (YYYY.MM.DD), newest wins.
#
# Each [[firmware]] entry matches firmware paths starting with `path` (a folder like
# "rtl_nic/" or a file prefix like "iwlwifi-"). The longest matching path that has an
# entry for the user's distro wins, so the `path = ""` entry is the fallback.
# Family keys: arch, debian, ubuntu, fedora, opensuse. Unknown keys are ignored, so data
# can add a family before the app knows it.
#
# Verification status:
#   arch      checked against installed packages (pacman -Qo), 2026-11-02
#   debian, ubuntu, fedora, opensuse   from distro package listings, NOT yet checked in
#             containers (see docs/plan.md). Keep entries we aren't sure of out.
schema = 1
version = "2026.11.02"

[notes]
debian = "Debian keeps most firmware in the \"non-free-firmware\" section. It must be turned on in your software sources before these packages can be installed."

# Fallback for anything not listed below.
[[firmware]]
path = ""
arch = "linux-firmware"
ubuntu = "linux-firmware"
debian = "firmware-misc-nonfree"
fedora = "linux-firmware"
opensuse = "kernel-firmware-all"

