# Translations of the text in descriptions.toml and fixes.toml, language: es.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "es"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Tu tarjeta gráfica. Dibuja todo lo que ves en pantalla y hace el trabajo pesado en juegos y vídeos."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Envía sonido a los altavoces, auriculares o monitor, y capta el sonido de los micrófonos."
"Connects your computer to a network with a cable (wired Ethernet)." = "Conecta tu ordenador a una red con un cable (Ethernet por cable)."
"Connects your computer to wireless networks (Wi-Fi)." = "Conecta tu ordenador a redes inalámbricas (Wi-Fi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Una unidad de almacenamiento rápido (una SSD NVMe) que contiene tu sistema, programas y archivos."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Conecta unidades SATA, como discos duros, SSD y unidades de DVD, al ordenador."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Controla un grupo de puertos USB para que los dispositivos que conectes puedan comunicarse con el ordenador."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Controla puertos USB4 y Thunderbolt: conexiones muy rápidas para bases, unidades y pantallas."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Una pequeña conexión interna que la placa base usa para leer sensores, como temperaturas y velocidades de los ventiladores, y para comunicarse con la memoria."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Conecta el procesador al resto del ordenador. Es parte de la placa base y funciona sin controlador."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Conecta las partes más lentas de la placa base, como el chip de firmware y los controles del ventilador."
"Links expansion slots and built-in devices to the processor." = "Vincula las ranuras de expansión y los dispositivos integrados al procesador."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Evita que los dispositivos lean la memoria que no deberían. Se utiliza para seguridad y para máquinas virtuales."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Un chip de seguridad que se encarga del cifrado y protege secretos como contraseñas y claves de disco."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Un acelerador de IA (una unidad de procesamiento neuronal) que ejecuta tareas de IA de forma rápida y eficiente."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Añade Bluetooth para auriculares inalámbricos, mandos, teclados y más."
"Connects older storage drives and other devices that use the SCSI standard." = "Conecta unidades de almacenamiento antiguas y otros dispositivos que utilizan el estándar SCSI."
"Connects older hard drives and other storage devices that use the IDE standard." = "Conecta discos duros antiguos y otros dispositivos de almacenamiento que utilizan el estándar IDE."
"Combines several storage drives so they can work together for speed or protection." = "Combina varias unidades de almacenamiento para que trabajen juntas y ganen velocidad o protección."
"Connects storage drives that use the ATA standard." = "Conecta unidades de almacenamiento que usan el estándar ATA."
"Connects storage drives that use the SAS standard." = "Conecta unidades de almacenamiento que utilizan el estándar SAS."
"Connects a storage device that does not use a more specific standard." = "Conecta un dispositivo de almacenamiento que no utiliza un estándar más específico."
"A second graphics processor that can help draw games, videos, and other pictures." = "Un segundo procesador gráfico que puede ayudar a dibujar juegos, vídeos y otras imágenes."
"Captures video from a camera, television signal, or another video source." = "Captura vídeo de una cámara, señal de televisión u otra fuente de vídeo."
"An older sound card that plays and records sound." = "Una tarjeta de sonido antigua que reproduce y graba sonido."
"Connects older devices through a serial port, one bit at a time." = "Conecta dispositivos antiguos a través de un puerto serie, bit a bit."
"Connects older printers and other devices through a parallel port." = "Conecta impresoras antiguas y otros dispositivos a través de un puerto paralelo."
"Connects to the internet or another computer through a modem." = "Se conecta a Internet o a otro ordenador a través de un módem."
"Reads memory cards through an SD card slot." = "Lee tarjetas de memoria a través de una ranura para tarjetas SD."
"Connects older FireWire devices, such as cameras and storage drives." = "Conecta dispositivos FireWire antiguos, como cámaras y unidades de almacenamiento."
"Connects high-speed networks used by servers and other specialised computers." = "Conecta redes de alta velocidad utilizadas por servidores y otros ordenadores especializados."
"Connects devices through another type of serial bus." = "Conecta dispositivos a través de otro tipo de bus serie."
"Connects a wireless device that does not use a more specific wireless standard." = "Conecta un dispositivo inalámbrico que no utiliza un estándar inalámbrico más específico."
"Helps the computer manage power or improve performance." = "Ayuda al ordenador a gestionar la energía o a mejorar el rendimiento."
"A special-purpose device used to inspect or test the computer." = "Un dispositivo de propósito especial utilizado para inspeccionar o probar el ordenador."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Reproduce o graba sonido a través de USB, como auriculares, micrófono o interfaz de audio."
"A network or modem connection over USB." = "Una conexión de red o módem a través de USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Te permite controlar el ordenador, como un teclado, un ratón, un mando de juegos o un mando a distancia. Algunos dispositivos de iluminación y refrigeración también usan este tipo de conexión."
"A camera or scanner that transfers pictures to the computer." = "Una cámara o escáner que transfiere imágenes al ordenador."
"A printer connected by USB." = "Una impresora conectada por USB."
"Stores files: a USB stick, card reader, or external drive." = "Almacena archivos: una memoria USB, un lector de tarjetas o una unidad externa."
"Adds more USB ports by sharing one connection." = "Añade más puertos USB compartiendo una conexión."
"Reads smart cards, like ID, bank, or security cards." = "Lee tarjetas inteligentes, como tarjetas de identificación, bancarias o de seguridad."
"A webcam or video capture device." = "Una cámara web o un dispositivo de captura de vídeo."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Conecta un dispositivo de atención médica personal, como un tensiómetro."
"Plays or records sound and video over USB." = "Reproduce o graba sonido y vídeo a través de USB."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Avisa de que una base USB-C o un adaptador no puede usar uno de sus modos de conexión."
"A USB device used to inspect or test another device." = "Un dispositivo USB utilizado para inspeccionar o probar otro dispositivo."
"A USB device with a special purpose that does not fit another group." = "Un dispositivo USB con un propósito especial que no encaja en otro grupo."
"A USB device in firmware update mode." = "Un dispositivo USB en modo de actualización de firmware."
"A game controller (Xbox style)." = "Un mando de juego (estilo Xbox)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Controla la bomba, los ventiladores y la iluminación de un sistema de refrigeración líquida NZXT."
"Controls the RGB lighting on your motherboard." = "Controla la iluminación RGB de la placa base."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Un receptor inalámbrico para teclados y ratones Logitech (Logi Bolt)."
"Draws everything you see on your screen." = "Dibuja todo lo que ves en tu pantalla."
"Plays sound through your speakers or headphones, and records from microphones." = "Reproduce sonido a través de los altavoces o auriculares y graba desde los micrófonos."
"Connects your computer to the internet and other computers." = "Conecta tu ordenador a Internet y a otros ordenadores."
"Stores your system, programs, and files, or connects the drives that do." = "Almacena tu sistema, programas y archivos, o conecta las unidades que lo hacen."
"Runs USB ports, so the things you plug in can talk to the computer." = "Controla puertos USB para que lo que conectes pueda comunicarse con el ordenador."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Controla puertos Thunderbolt y USB4: conexiones muy rápidas para bases, unidades y pantallas."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Te permite controlar el ordenador: teclados, ratones, mandos de juego y dispositivos similares."
"Captures video or pictures, like a webcam." = "Captura vídeos o imágenes, como una cámara web."
"Prints or scans documents and photos." = "Imprime o escanea documentos y fotos."
"Sends data over older-style connections such as serial ports and modems." = "Envía datos a través de conexiones de estilo antiguo, como puertos serie y módems."
"Handles encryption and protects secrets like passwords and disk keys." = "Se encarga del cifrado y protege secretos como contraseñas y claves de disco."
"Speeds up special kinds of work, such as AI tasks." = "Acelera tipos especiales de trabajo, como las tareas de IA."
"Part of the processor, the computer's main brain." = "Parte del procesador, el cerebro del ordenador."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Una parte incorporada de la placa base que mantiene el equipo en funcionamiento. Normalmente nunca tienes que pensar en ello."
"A device that doesn't fit the usual groups." = "Un dispositivo que no se ajusta a los grupos habituales."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Instala el paquete que contiene el firmware que falta ({package}) y reinicia el equipo."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "El controlador necesita el archivo de firmware {file}, que no está instalado. Busca ese nombre de archivo en los paquetes de tu distribución, instala el paquete y reinicia."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Reinicia el equipo. El firmware que necesita está instalado ahora, pero faltaba cuando se inició el equipo."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "El dispositivo no respondió al controlador a tiempo. Reinicia el equipo. Si es una tarjeta dentro del ordenador, comprueba que está bien encajada en su ranura y que su cable de alimentación (si lo tiene) está conectado."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "El dispositivo respondió con errores. Reinicia el equipo. Si sigue ocurriendo, el dispositivo o su conexión pueden estar defectuosos: prueba con otro puerto o ranura si puedes."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Es posible que otro controlador ya esté usando este dispositivo. Reiniciar el equipo suele resolverlo."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "El controlador no ha podido iniciar el dispositivo. Reinicia el equipo. Si sigue ocurriendo, busca en línea el ID de hardware del dispositivo ({hardware_id}) junto con \"Linux\"."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Hay un controlador para este dispositivo ({module}) instalado, pero no está en marcha. Inícialo ahora con este comando. Normalmente se inicia solo después de reiniciar."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "El controlador {module} está desactivado por un ajuste en {file}. Para volver a activarlo, elimina de ese archivo la línea que menciona {module} y reinicia. A veces estos ajustes se añaden a propósito, por ejemplo al instalar otro controlador gráfico."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "El controlador {module} está desactivado en la configuración de arranque (la línea de comandos del kernel). Elimina \"{module}\" de la opción blacklist y reinicia."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "El controlador {module} está en marcha, pero no ha tomado este dispositivo. Reiniciar el equipo suele solucionarlo. Si no, el motivo suele aparecer arriba."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "El controlador se inició, pero no terminó de configurar el dispositivo. Reinicia el equipo. Si eso no ayuda, el motivo suele aparecer arriba (a menudo falta firmware)."
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\". A later version of hwsight will suggest driver packages for many devices." = "Ningún controlador instalado en este equipo es compatible con este dispositivo. Busca en Internet su ID de hardware ({hardware_id}) junto con \"controlador Linux\". Una versión futura de hwsight sugerirá paquetes de controladores para muchos dispositivos."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Este dispositivo fue bloqueado por tu configuración de seguridad USB (como USBGuard). Si confías en él, permítelo en esa configuración, luego desenchúfalo y vuelve a conectarlo."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Empareja ratones y teclados inalámbricos Logitech con su receptor y muestra su nivel de batería y sus ajustes."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Muestra la temperatura y la velocidad de la bomba y los ventiladores de sistemas de refrigeración líquida y de algunas fuentes de alimentación, y te permite cambiar sus velocidades y luces."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "Es un programa de línea de comandos. Su sitio web tiene pasos de instalación para cada distribución, incluido uno que funciona en todas partes con pipx de Python."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Controla las luces de dispositivos RGB de muchas marcas en un solo lugar, como placas base, memorias, teclados y ventiladores."
