# Translations of the text in descriptions.toml and fixes.toml, language: de.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "de"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Deine Grafikkarte. Sie stellt alles dar, was du auf dem Bildschirm siehst, und leistet die Schwerarbeit bei Spielen und Videos."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Sendet Ton an deine Lautsprecher, Kopfhörer oder deinen Monitor und nimmt Ton von Mikrofonen auf."
"Connects your computer to a network with a cable (wired Ethernet)." = "Verbindet deinen Computer mit einem Netzwerk über ein Kabel (kabelgebundenes Ethernet)."
"Connects your computer to wireless networks (Wi-Fi)." = "Verbindet deinen Computer mit drahtlosen Netzwerken (Wi-Fi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Ein schnelles Speicherlaufwerk (eine NVMe-SSD), das dein System, deine Programme und Dateien enthält."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Verbindet SATA-Laufwerke wie Festplatten, SSDs und DVD-Laufwerke mit dem Computer."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Steuert eine Gruppe von USB-Anschlüssen, damit die Geräte, die du anschließt, mit dem Computer kommunizieren können."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Steuert USB4- und Thunderbolt-Anschlüsse: sehr schnelle Verbindungen für Docks, Laufwerke und Bildschirme."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Eine kleine interne Verbindung, über die das Mainboard Sensoren wie Temperaturen und Lüftergeschwindigkeiten ausliest und mit dem Arbeitsspeicher kommuniziert."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Verbindet den Prozessor mit dem Rest des Computers. Gehört zum Mainboard und funktioniert ohne Treiber."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Verbindet langsamere Teile des Mainboards, etwa den Firmware-Chip und die Lüftersteuerung."
"Links expansion slots and built-in devices to the processor." = "Verknüpft Erweiterungssteckplätze und eingebaute Geräte mit dem Prozessor."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Verhindert, dass Geräte Speicher lesen, den sie nicht lesen dürfen. Wird für die Sicherheit und für virtuelle Maschinen verwendet."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Ein Sicherheitschip, der die Verschlüsselung übernimmt und Geheimnisse wie Passwörter und Festplattenschlüssel schützt."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Ein KI-Beschleuniger (eine neuronale Verarbeitungseinheit), der KI-Aufgaben schnell und effizient ausführt."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Fügt Bluetooth hinzu, für drahtlose Kopfhörer, Controller, Tastaturen und mehr."
"Connects older storage drives and other devices that use the SCSI standard." = "Verbindet ältere Speicherlaufwerke und andere Geräte, die den SCSI-Standard verwenden."
"Connects older hard drives and other storage devices that use the IDE standard." = "Verbindet ältere Festplatten und andere Speichergeräte, die den IDE-Standard verwenden."
"Combines several storage drives so they can work together for speed or protection." = "Kombiniert mehrere Speicherlaufwerke, damit sie für Geschwindigkeit oder Schutz zusammenarbeiten können."
"Connects storage drives that use the ATA standard." = "Verbindet Speicherlaufwerke, die den ATA-Standard verwenden."
"Connects storage drives that use the SAS standard." = "Verbindet Speicherlaufwerke, die den SAS-Standard verwenden."
"Connects a storage device that does not use a more specific standard." = "Verbindet ein Speichergerät, das keinen spezifischeren Standard verwendet."
"A second graphics processor that can help draw games, videos, and other pictures." = "Ein zweiter Grafikprozessor, der beim Darstellen von Spielen, Videos und anderen Bildern helfen kann."
"Captures video from a camera, television signal, or another video source." = "Erfasst Video von einer Kamera, einem Fernsehsignal oder einer anderen Videoquelle."
"An older sound card that plays and records sound." = "Eine ältere Soundkarte, die Ton wiedergibt und aufzeichnet."
"Connects older devices through a serial port, one bit at a time." = "Verbindet ältere Geräte bitweise über einen seriellen Port."
"Connects older printers and other devices through a parallel port." = "Verbindet ältere Drucker und andere Geräte über einen parallelen Port."
"Connects to the internet or another computer through a modem." = "Verbindet sich über ein Modem mit dem Internet oder einem anderen Computer."
"Reads memory cards through an SD card slot." = "Liest Speicherkarten über einen SD-Kartensteckplatz."
"Connects older FireWire devices, such as cameras and storage drives." = "Verbindet ältere FireWire-Geräte wie Kameras und Speicherlaufwerke."
"Connects high-speed networks used by servers and other specialised computers." = "Verbindet Hochgeschwindigkeitsnetzwerke, die von Servern und anderen spezialisierten Computern verwendet werden."
"Connects devices through another type of serial bus." = "Verbindet Geräte über eine andere Art von seriellem Bus."
"Connects a wireless device that does not use a more specific wireless standard." = "Verbindet ein drahtloses Gerät, das keinen spezifischeren drahtlosen Standard verwendet."
"Helps the computer manage power or improve performance." = "Hilft dem Computer, die Stromversorgung zu verwalten oder die Leistung zu verbessern."
"A special-purpose device used to inspect or test the computer." = "Ein Spezialgerät, das zur Inspektion oder zum Testen des Computers verwendet wird."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Gibt Ton über USB wieder oder nimmt ihn auf, zum Beispiel ein Headset, ein Mikrofon oder ein Audio-Interface."
"A network or modem connection over USB." = "Eine Netzwerk- oder Modemverbindung über USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Ermöglicht die Steuerung des Computers, z. B. Tastatur, Maus, Gamecontroller oder Fernbedienung. Einige Beleuchtungs- und Kühlgeräte verwenden auch diese Art von Verbindung."
"A camera or scanner that transfers pictures to the computer." = "Eine Kamera oder ein Scanner, der Bilder auf den Computer überträgt."
"A printer connected by USB." = "Ein Drucker, der über USB angeschlossen ist."
"Stores files: a USB stick, card reader, or external drive." = "Speichert Dateien: USB-Stick, Kartenleser oder externes Laufwerk."
"Adds more USB ports by sharing one connection." = "Fügt weitere USB-Anschlüsse hinzu, indem eine Verbindung gemeinsam genutzt wird."
"Reads smart cards, like ID, bank, or security cards." = "Liest Smartcards wie Ausweis-, Bank- oder Sicherheitskarten."
"A webcam or video capture device." = "Eine Webcam oder ein Videoaufnahmegerät."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Verbindet ein persönliches Gesundheitsgerät, z. B. ein Blutdruckmessgerät."
"Plays or records sound and video over USB." = "Gibt Ton und Video über USB wieder oder nimmt sie auf."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Meldet, dass ein USB-C-Dock oder -Adapter keinen seiner Verbindungsmodi verwenden kann."
"A USB device used to inspect or test another device." = "Ein USB-Gerät, das zur Inspektion oder zum Testen eines anderen Geräts verwendet wird."
"A USB device with a special purpose that does not fit another group." = "Ein USB-Gerät mit einem speziellen Zweck, das nicht zu einer anderen Gruppe passt."
"A USB device in firmware update mode." = "Ein USB-Gerät im Firmware-Aktualisierungsmodus."
"A game controller (Xbox style)." = "Ein Spiel-Controller (Xbox-Stil)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Steuert die Pumpe, die Lüfter und die Beleuchtung eines NZXT-Flüssigkeitskühlers."
"Controls the RGB lighting on your motherboard." = "Steuert die RGB-Beleuchtung auf deinem Mainboard."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Ein drahtloser Empfänger für Logitech-Tastaturen und -Mäuse (Logi Bolt)."
"Draws everything you see on your screen." = "Stellt alles dar, was du auf deinem Bildschirm siehst."
"Plays sound through your speakers or headphones, and records from microphones." = "Spielt Ton über deine Lautsprecher oder Kopfhörer ab und nimmt von Mikrofonen auf."
"Connects your computer to the internet and other computers." = "Verbindet deinen Computer mit dem Internet und anderen Computern."
"Stores your system, programs, and files, or connects the drives that do." = "Speichert dein System, deine Programme und Dateien oder verbindet die Laufwerke, die das tun."
"Runs USB ports, so the things you plug in can talk to the computer." = "Steuert USB-Anschlüsse, damit alles, was du anschließt, mit dem Computer kommunizieren kann."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Steuert Thunderbolt- und USB4-Anschlüsse: sehr schnelle Verbindungen für Docks, Laufwerke und Bildschirme."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Ermöglicht die Steuerung des Computers: Tastaturen, Mäuse, Gamecontroller und ähnliche Geräte."
"Captures video or pictures, like a webcam." = "Nimmt Videos oder Bilder auf, wie eine Webcam."
"Prints or scans documents and photos." = "Druckt oder scannt Dokumente und Fotos."
"Sends data over older-style connections such as serial ports and modems." = "Sendet Daten über ältere Verbindungen wie serielle Ports und Modems."
"Handles encryption and protects secrets like passwords and disk keys." = "Übernimmt die Verschlüsselung und schützt Geheimnisse wie Passwörter und Festplattenschlüssel."
"Speeds up special kinds of work, such as AI tasks." = "Beschleunigt spezielle Arten von Arbeit, wie z. B. KI-Aufgaben."
"Part of the processor, the computer's main brain." = "Ein Teil des Prozessors, des Gehirns des Computers."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Ein eingebauter Teil deines Mainboards, der den Computer am Laufen hält. Normalerweise musst du dich nie darum kümmern."
"A device that doesn't fit the usual groups." = "Ein Gerät, das nicht zu den üblichen Gruppen passt."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Installiere das Paket, das die fehlende Firmware enthält ({package}), und starte den Computer neu."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "Der Treiber benötigt die Firmware-Datei {file}, die nicht installiert ist. Suche in den Paketen deiner Distribution nach diesem Dateinamen, installiere das Paket und starte dann neu."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Starte den Computer neu. Die benötigte Firmware ist jetzt installiert, aber sie fehlte beim Start."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "Das Gerät hat dem Treiber nicht rechtzeitig geantwortet. Starte den Computer neu. Wenn es eine Karte im Computer ist, prüfe, ob sie fest im Steckplatz sitzt und ihr Stromkabel (falls vorhanden) angeschlossen ist."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "Das Gerät antwortete mit Fehlern. Starte den Computer neu. Wenn dies weiterhin geschieht, ist das Gerät oder seine Verbindung möglicherweise fehlerhaft: Versuche es mit einem anderen Anschluss oder Steckplatz, wenn du kannst."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Möglicherweise verwendet bereits ein anderer Treiber dieses Gerät. Ein Neustart des Computers behebt das normalerweise."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "Der Treiber konnte das Gerät nicht starten. Starte den Computer neu. Wenn dies weiterhin geschieht, suche online nach der Hardware-ID des Geräts ({hardware_id}) zusammen mit \"Linux\"."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Ein Treiber für dieses Gerät ({module}) ist installiert, läuft aber nicht. Starte ihn jetzt mit diesem Befehl. Er startet normalerweise von selbst nach einem Neustart."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "Der {module}-Treiber wird durch eine Einstellung in {file} ausgeschaltet. Um ihn wieder einzuschalten, entferne die Zeile, in der {module} erwähnt wird, aus dieser Datei und starte den Computer neu. Solche Einstellungen werden manchmal absichtlich hinzugefügt, zum Beispiel bei der Installation eines anderen Grafiktreibers."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "Der {module}-Treiber ist in deinen Boot-Einstellungen (der Kernel-Befehlszeile) ausgeschaltet. Entferne dort \"{module}\" aus der Blacklist-Option und starte dann den Computer neu."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "Der {module}-Treiber läuft, hat dieses Gerät aber nicht übernommen. Ein Neustart des Computers behebt das oft. Wenn nicht, steht der Grund meist weiter oben."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "Der Treiber hat gestartet, aber die Einrichtung des Geräts nicht abgeschlossen. Starte den Computer neu. Wenn das nicht hilft, wird der Grund in der Regel oben angezeigt (oft fehlende Firmware)."
"No driver installed on this computer supports this device. Search online for its hardware ID ({hardware_id}) together with \"Linux driver\". A later version of hwsight will suggest driver packages for many devices." = "Kein auf diesem Computer installierter Treiber unterstützt dieses Gerät. Suche online nach seiner Hardware-ID ({hardware_id}) zusammen mit \"Linux-Treiber\". Eine spätere Version von hwsight wird Treiberpakete für viele Geräte vorschlagen."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Dieses Gerät wurde durch deine USB-Sicherheitseinstellungen (z. B. USBGuard) blockiert. Wenn du ihm vertraust, lass es in diesen Einstellungen zu, zieh es dann ab und schließ es wieder an."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Koppelt kabellose Logitech-Mäuse und -Tastaturen mit ihrem Empfänger und zeigt deren Akkustand und Einstellungen an."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Zeigt die Temperatur, Pumpen- und Lüftergeschwindigkeit von Flüssigkeitskühlern und einigen Netzteilen an und ermöglicht dir, deren Geschwindigkeit und Beleuchtung zu ändern."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "Es ist ein Befehlszeilenprogramm. Auf der Website findest du Installationsschritte für jede Distribution, einschließlich einer, die über Pythons pipx überall funktioniert."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Steuert die Lichter von RGB-Geräten vieler Marken an einem Ort, z. B. Motherboards, Speicher, Tastaturen und Lüfter."
