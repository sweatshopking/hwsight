# Translations of the text in descriptions.toml and fixes.toml, language: fr.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "fr"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Votre carte graphique. Elle dessine tout ce que vous voyez à l’écran et fait le gros du travail dans les jeux et les vidéos."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Envoie le son à vos haut-parleurs, écouteurs ou moniteur et capte le son des microphones."
"Connects your computer to a network with a cable (wired Ethernet)." = "Connecte votre ordinateur à un réseau avec un câble (Ethernet filaire)."
"Connects your computer to wireless networks (Wi-Fi)." = "Connecte votre ordinateur aux réseaux sans fil (Wi-Fi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Un disque de stockage rapide (un SSD NVMe) qui contient votre système, vos programmes et vos fichiers."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Connecte les disques SATA, comme les disques durs, les SSD et les lecteurs de DVD, à l'ordinateur."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Gère un groupe de ports USB, pour que les appareils que vous branchez puissent communiquer avec l’ordinateur."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Gère les ports USB4 et Thunderbolt : des connexions très rapides pour les stations d’accueil, les disques et les écrans."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Une petite connexion interne que la carte mère utilise pour lire les capteurs, tels que les températures et la vitesse des ventilateurs, et pour communiquer avec la mémoire."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Connecte le processeur au reste de l'ordinateur. Il fait partie de la carte mère et fonctionne sans pilote."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Connecte les parties plus lentes de la carte mère, comme la puce du micrologiciel et les commandes des ventilateurs."
"Links expansion slots and built-in devices to the processor." = "Relie les emplacements d’extension et les périphériques intégrés au processeur."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Empêche les appareils de lire de la mémoire à laquelle ils ne doivent pas accéder. Sert à la sécurité et aux machines virtuelles."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Une puce de sécurité qui gère le chiffrement et protège les secrets comme les mots de passe et les clés de disque."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Un accélérateur d'IA (une unité de traitement neuronal) qui exécute les tâches d'IA rapidement et efficacement."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Ajoute le Bluetooth, pour les écouteurs sans fil, les manettes, les claviers et plus encore."
"Connects older storage drives and other devices that use the SCSI standard." = "Connecte les anciens disques de stockage et autres périphériques utilisant la norme SCSI."
"Connects older hard drives and other storage devices that use the IDE standard." = "Connecte les anciens disques durs et autres périphériques de stockage utilisant la norme IDE."
"Combines several storage drives so they can work together for speed or protection." = "Combine plusieurs disques de stockage afin qu'ils puissent fonctionner ensemble pour plus de vitesse ou de protection."
"Connects storage drives that use the ATA standard." = "Connecte les disques de stockage qui utilisent la norme ATA."
"Connects storage drives that use the SAS standard." = "Connecte les disques de stockage qui utilisent la norme SAS."
"Connects a storage device that does not use a more specific standard." = "Permet de connecter un périphérique de stockage qui n'utilise pas de norme plus spécifique."
"A second graphics processor that can help draw games, videos, and other pictures." = "Un deuxième processeur graphique qui peut aider à dessiner des jeux, des vidéos et d'autres images."
"Captures video from a camera, television signal, or another video source." = "Capture la vidéo d'une caméra, d'un signal de télévision ou d'une autre source vidéo."
"An older sound card that plays and records sound." = "Une ancienne carte son qui lit et enregistre le son."
"Connects older devices through a serial port, one bit at a time." = "Connecte les appareils plus anciens via un port série, un bit à la fois."
"Connects older printers and other devices through a parallel port." = "Connecte les anciennes imprimantes et autres appareils via un port parallèle."
"Connects to the internet or another computer through a modem." = "Se connecte à Internet ou à un autre ordinateur via un modem."
"Reads memory cards through an SD card slot." = "Lit les cartes mémoire via un emplacement pour carte SD."
"Connects older FireWire devices, such as cameras and storage drives." = "Connecte les anciens appareils FireWire, tels que les caméras et les disques de stockage."
"Connects high-speed networks used by servers and other specialised computers." = "Connecte les réseaux à haut débit utilisés par les serveurs et autres ordinateurs spécialisés."
"Connects devices through another type of serial bus." = "Connecte les appareils via un autre type de bus série."
"Connects a wireless device that does not use a more specific wireless standard." = "Permet de connecter un périphérique sans fil qui n'utilise pas de norme sans fil plus spécifique."
"Helps the computer manage power or improve performance." = "Aide l'ordinateur à gérer l'alimentation ou à améliorer les performances."
"A special-purpose device used to inspect or test the computer." = "Un appareil à usage spécial utilisé pour inspecter ou tester l’ordinateur."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Lit ou enregistre le son via USB, comme un casque, un microphone ou une interface audio."
"A network or modem connection over USB." = "Une connexion réseau ou modem via USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Vous permet de contrôler l'ordinateur, comme un clavier, une souris, une manette de jeu ou une télécommande. Certains gadgets d’éclairage et de refroidissement utilisent également ce type de connexion."
"A camera or scanner that transfers pictures to the computer." = "Un appareil photo ou un scanner qui transfère des images vers l'ordinateur."
"A printer connected by USB." = "Une imprimante connectée en USB."
"Stores files: a USB stick, card reader, or external drive." = "Stocke des fichiers : une clé USB, un lecteur de carte ou un disque externe."
"Adds more USB ports by sharing one connection." = "Ajoute plus de ports USB en partageant une connexion."
"Reads smart cards, like ID, bank, or security cards." = "Lit les cartes à puce, telles que les cartes d'identité, bancaires ou de sécurité."
"A webcam or video capture device." = "Une webcam ou un appareil de capture vidéo."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Permet de connecter un appareil de santé personnel, tel qu'un tensiomètre."
"Plays or records sound and video over USB." = "Lit ou enregistre le son et la vidéo via USB."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Signale qu'une station d'accueil ou un adaptateur USB-C ne peut pas utiliser l'un de ses modes de connexion."
"A USB device used to inspect or test another device." = "Un périphérique USB utilisé pour inspecter ou tester un autre périphérique."
"A USB device with a special purpose that does not fit another group." = "Un périphérique USB ayant un usage particulier qui ne correspond pas à un autre groupe."
"A USB device in firmware update mode." = "Un périphérique USB en mode de mise à jour du micrologiciel."
"A game controller (Xbox style)." = "Une manette de jeu (style Xbox)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Contrôle la pompe, les ventilateurs et l’éclairage d’un système de refroidissement liquide NZXT."
"Controls the RGB lighting on your motherboard." = "Contrôle l'éclairage RVB de votre carte mère."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Un récepteur sans fil pour claviers et souris Logitech (Logi Bolt)."
"Draws everything you see on your screen." = "Dessine tout ce que vous voyez sur votre écran."
"Plays sound through your speakers or headphones, and records from microphones." = "Lit le son via vos haut-parleurs ou vos écouteurs et enregistre à partir des microphones."
"Connects your computer to the internet and other computers." = "Connecte votre ordinateur à Internet et à d’autres ordinateurs."
"Stores your system, programs, and files, or connects the drives that do." = "Stocke votre système, vos programmes et vos fichiers, ou connecte les lecteurs qui le font."
"Runs USB ports, so the things you plug in can talk to the computer." = "Gère les ports USB, pour que ce que vous branchez puisse communiquer avec l’ordinateur."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Gère les ports Thunderbolt et USB4 : des connexions très rapides pour les stations d’accueil, les disques et les écrans."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Vous permet de contrôler l’ordinateur : claviers, souris, manettes de jeu et appareils similaires."
"Captures video or pictures, like a webcam." = "Capture des vidéos ou des images, comme une webcam."
"Prints or scans documents and photos." = "Imprime ou numérise des documents et des photos."
"Sends data over older-style connections such as serial ports and modems." = "Envoie des données via des connexions de style ancien telles que des ports série et des modems."
"Handles encryption and protects secrets like passwords and disk keys." = "Gère le chiffrement et protège les secrets comme les mots de passe et les clés de disque."
"Speeds up special kinds of work, such as AI tasks." = "Accélère des types de travail spéciaux, tels que les tâches d'IA."
"Part of the processor, the computer's main brain." = "Une partie du processeur, le cerveau de l’ordinateur."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Un élément intégré à votre carte mère qui assure le fonctionnement de l'ordinateur. Normalement, vous n’avez jamais besoin d’y penser."
"A device that doesn't fit the usual groups." = "Un appareil qui ne rentre pas dans les groupes habituels."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Installez le paquet qui contient le micrologiciel manquant ({package}), puis redémarrez l’ordinateur."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "Le pilote a besoin du fichier de micrologiciel {file}, qui n’est pas installé. Recherchez ce nom de fichier dans les paquets de votre distribution, installez le paquet, puis redémarrez."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Redémarrez l’ordinateur. Le micrologiciel dont il a besoin est maintenant installé, mais il manquait au démarrage de l’ordinateur."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "L'appareil n'a pas répondu au pilote à temps. Redémarrez l'ordinateur. S'il s'agit d'une carte à l'intérieur de l'ordinateur, vérifiez qu'elle est fermement enfoncée dans son emplacement et que son câble d'alimentation (s'il en a un) est connecté."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "L'appareil a répondu avec des erreurs. Redémarrez l'ordinateur. Si cela continue, l'appareil ou sa connexion est peut-être défectueux : essayez un autre port ou un autre emplacement si vous le pouvez."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Un autre pilote utilise peut-être déjà ce périphérique. Le redémarrage de l'ordinateur résout généralement ce problème."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "Le pilote n'a pas pu démarrer l'appareil. Redémarrez l'ordinateur. Si cela continue, recherchez en ligne l'ID matériel de l'appareil ({hardware_id}) ainsi que \"Linux\"."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Un pilote pour ce périphérique ({module}) est installé mais n'est pas en cours d'exécution. Démarrez-le maintenant avec cette commande. Il démarre normalement tout seul après un redémarrage."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "Le pilote {module} est désactivé par un paramètre dans {file}. Pour le réactiver, supprimez la ligne mentionnant {module} de ce fichier, puis redémarrez. Des paramètres comme celui-ci sont parfois ajoutés volontairement, par exemple lors de l'installation d'un autre pilote graphique."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "Le pilote {module} est désactivé dans vos paramètres de démarrage (la ligne de commande du noyau). Supprimez \"{module}\" de l'option de liste noire, puis redémarrez."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "Le pilote {module} est en cours d'exécution mais n'a pas pris en charge ce périphérique. Le redémarrage de l'ordinateur résout souvent ce problème. Sinon, la raison est généralement indiquée ci-dessus."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "Le pilote a démarré mais n’a pas fini de configurer l’appareil. Redémarrez l’ordinateur. Si cela ne suffit pas, la raison est généralement indiquée ci-dessus (souvent un micrologiciel manquant)."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Cet appareil a été bloqué par vos paramètres de sécurité USB (tels que USBGuard). Si vous lui faites confiance, autorisez-le dans ces paramètres, puis débranchez-le et rebranchez-le."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Associe les souris et claviers sans fil Logitech à leur récepteur, et affiche leur niveau de batterie et leurs réglages."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Affiche la température et la vitesse de la pompe et des ventilateurs des refroidissements liquides et de certaines alimentations, et vous permet de modifier leurs vitesses et leurs lumières."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "C’est un programme en ligne de commande. Son site web donne les étapes d’installation pour chaque distribution, dont une qui fonctionne partout grâce à pipx, de Python."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Contrôle les lumières des appareils RVB de nombreuses marques en un seul endroit, tels que les cartes mères, la mémoire, les claviers et les ventilateurs."
