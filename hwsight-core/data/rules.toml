# hwsight knowledge rules.
#
# This file is built into hwsight and can be replaced by a newer downloaded copy.
# `schema` is the file format version: bump it only for changes old hwsight versions
# can't read. `version` is the release date of this data (YYYY.MM.DD); newest wins.
schema = 1
version = "2026.11.02"

# Devices that normally work with no driver attached. Without these rules hwsight would
# raise false alarms about parts of every motherboard.
#
# Match fields (all optional, all must match, hex without "0x"):
#   class       base class, 2 digits
#   subclasses  list of subclasses, 2 digits each (omit to match the whole class)
#   vendor      4-digit vendor ID
#   prog_ifs    list of programming interfaces, 2 digits each (needs subclasses)
#   device      4-digit device ID (needs vendor)

[[no_driver_needed]]
class = "05"
reason = "Memory controllers are run by the motherboard firmware."

[[no_driver_needed]]
class = "06"
subclasses = ["00", "01", "02", "03", "04", "80"]
reason = "Bridges connect parts of the computer together and work without a driver."

[[no_driver_needed]]
class = "08"
subclasses = ["00", "01", "02", "03", "04", "05", "06", "07"]
reason = "This core system part is handled directly by the kernel."

[[no_driver_needed]]
class = "0b"
reason = "Processors are handled directly by the kernel."

[[no_driver_needed]]
class = "13"
reason = "This is a testing or debugging function that isn't used in normal operation."

# What a working driver creates for each kind of device. If the driver is attached but
# this is missing, the device isn't actually usable (often a firmware or setup failure).
#
# Match fields as above, plus:
#   interface   folder name (or name prefix) the driver creates under the device in sysfs
#   what        plain-English name for it, used in "no <what> was created"

[[expect_interface]]
class = "02"
interface = "net"
what = "network connection"

[[expect_interface]]
class = "03"
interface = "drm"
what = "display device"

[[expect_interface]]
class = "04"
subclasses = ["03"]
interface = "sound"
what = "sound card"

[[expect_interface]]
class = "01"
subclasses = ["08"]
interface = "nvme"
what = "drive"

[[expect_interface]]
class = "01"
subclasses = ["06"]
interface = "ata"
what = "drive connection"

# UHCI, OHCI, EHCI, and xHCI controllers. Not 40 (USB4/Thunderbolt hosts).
[[expect_interface]]
class = "0c"
subclasses = ["03"]
prog_ifs = ["00", "10", "20", "30"]
interface = "usb"
what = "set of USB ports"
