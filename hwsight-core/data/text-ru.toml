# Translations of the text in descriptions.toml and fixes.toml, language: ru.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "ru"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Ваша видеокарта. Она рисует всё, что вы видите на экране, и берёт на себя основную нагрузку в играх и видео."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Отправляет звук на динамики, наушники или монитор и принимает звук с микрофонов."
"Connects your computer to a network with a cable (wired Ethernet)." = "Подключает компьютер к сети с помощью кабеля (проводной Ethernet)."
"Connects your computer to wireless networks (Wi-Fi)." = "Подключает ваш компьютер к беспроводным сетям (Wi-Fi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Быстрый накопитель (SSD-накопитель NVMe), на котором хранится ваша система, программы и файлы."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Подключает диски SATA, такие как жесткие диски, твердотельные накопители и DVD-приводы, к компьютеру."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Управляет группой портов USB, чтобы подключённые устройства могли работать с компьютером."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Управляет портами USB4 и Thunderbolt: очень быстрые подключения для док-станций, накопителей и мониторов."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Небольшое внутреннее соединение, через которое материнская плата считывает датчики, например температуру и скорость вентиляторов, и обменивается данными с памятью."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Соединяет процессор с остальным компьютером. Входит в состав материнской платы и работает без драйвера."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Соединяет более медленные части материнской платы, например микросхему прошивки и управление вентиляторами."
"Links expansion slots and built-in devices to the processor." = "Связывает слоты расширения и встроенные устройства с процессором."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Не даёт устройствам читать память, к которой у них не должно быть доступа. Используется для безопасности и для виртуальных машин."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Чип безопасности, который выполняет шифрование и защищает такие секреты, как пароли и ключи диска."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Ускоритель искусственного интеллекта (нейронный процессор), который быстро и эффективно выполняет задачи искусственного интеллекта."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Добавляет Bluetooth для беспроводных наушников, геймпадов, клавиатур и не только."
"Connects older storage drives and other devices that use the SCSI standard." = "Подключает старые накопители и другие устройства, использующие стандарт SCSI."
"Connects older hard drives and other storage devices that use the IDE standard." = "Подключает старые жесткие диски и другие устройства хранения данных, использующие стандарт IDE."
"Combines several storage drives so they can work together for speed or protection." = "Объединяет несколько накопителей, чтобы они работали вместе ради скорости или защиты данных."
"Connects storage drives that use the ATA standard." = "Подключает накопители, использующие стандарт ATA."
"Connects storage drives that use the SAS standard." = "Подключает накопители, использующие стандарт SAS."
"Connects a storage device that does not use a more specific standard." = "Подключает устройство хранения данных, которое не использует более конкретный стандарт."
"A second graphics processor that can help draw games, videos, and other pictures." = "Второй графический процессор, который помогает рисовать игры, видео и другие изображения."
"Captures video from a camera, television signal, or another video source." = "Захватывает видео с камеры, телевизионного сигнала или другого видеоисточника."
"An older sound card that plays and records sound." = "Старая звуковая карта, воспроизводящая и записывающая звук."
"Connects older devices through a serial port, one bit at a time." = "Подключает старые устройства через последовательный порт, по одному биту."
"Connects older printers and other devices through a parallel port." = "Подключает старые принтеры и другие устройства через параллельный порт."
"Connects to the internet or another computer through a modem." = "Подключается к Интернету или другому компьютеру через модем."
"Reads memory cards through an SD card slot." = "Читает карты памяти через слот для SD-карт."
"Connects older FireWire devices, such as cameras and storage drives." = "Подключает старые устройства FireWire, такие как камеры и накопители."
"Connects high-speed networks used by servers and other specialised computers." = "Соединяет высокоскоростные сети, используемые серверами и другими специализированными компьютерами."
"Connects devices through another type of serial bus." = "Подключает устройства через последовательную шину другого типа."
"Connects a wireless device that does not use a more specific wireless standard." = "Подключает беспроводное устройство, которое не использует более конкретный стандарт беспроводной связи."
"Helps the computer manage power or improve performance." = "Помогает компьютеру управлять питанием или повышать производительность."
"A special-purpose device used to inspect or test the computer." = "Специальное устройство, используемое для проверки или тестирования компьютера."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Воспроизводит или записывает звук через USB, например гарнитура, микрофон или аудиоинтерфейс."
"A network or modem connection over USB." = "Сетевое или модемное соединение через USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Позволяет управлять компьютером: например, клавиатура, мышь, геймпад или пульт. Некоторые устройства подсветки и охлаждения тоже используют такое подключение."
"A camera or scanner that transfers pictures to the computer." = "Камера или сканер, передающий снимки на компьютер."
"A printer connected by USB." = "Принтер, подключенный через USB."
"Stores files: a USB stick, card reader, or external drive." = "Хранит файлы: USB-накопитель, кард-ридер или внешний диск."
"Adds more USB ports by sharing one connection." = "Добавляет больше портов USB за счет совместного использования одного соединения."
"Reads smart cards, like ID, bank, or security cards." = "Считывает смарт-карты, такие как удостоверения личности, банковские карты или карты безопасности."
"A webcam or video capture device." = "Веб-камера или устройство видеозахвата."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Подключает персональное медицинское устройство, например тонометр."
"Plays or records sound and video over USB." = "Воспроизводит или записывает звук и видео через USB."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Сообщает, что док-станция или адаптер USB-C не может использовать один из режимов подключения."
"A USB device used to inspect or test another device." = "USB-устройство, используемое для проверки или тестирования другого устройства."
"A USB device with a special purpose that does not fit another group." = "USB-устройство особого назначения, которое не относится ни к одной другой группе."
"A USB device in firmware update mode." = "USB-устройство в режиме обновления прошивки."
"A game controller (Xbox style)." = "Геймпад (в стиле Xbox)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Управляет помпой, вентиляторами и подсветкой системы жидкостного охлаждения NZXT."
"Controls the RGB lighting on your motherboard." = "Управляет RGB-подсветкой на материнской плате."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Беспроводной приемник для клавиатур и мышей Logitech (Logi Bolt)."
"Draws everything you see on your screen." = "Рисует все, что вы видите на экране."
"Plays sound through your speakers or headphones, and records from microphones." = "Воспроизводит звук через динамики или наушники и записывает с микрофонов."
"Connects your computer to the internet and other computers." = "Подключает ваш компьютер к Интернету и другим компьютерам."
"Stores your system, programs, and files, or connects the drives that do." = "Хранит вашу систему, программы и файлы или подключает соответствующие диски."
"Runs USB ports, so the things you plug in can talk to the computer." = "Управляет портами USB, чтобы подключённые устройства могли работать с компьютером."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Управляет портами Thunderbolt и USB4: очень быстрые подключения для док-станций, накопителей и мониторов."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Позволяет управлять компьютером: клавиатуры, мыши, геймпады и похожие устройства."
"Captures video or pictures, like a webcam." = "Захватывает видео или изображения, как веб-камера."
"Prints or scans documents and photos." = "Печатает или сканирует документы и фотографии."
"Sends data over older-style connections such as serial ports and modems." = "Отправляет данные через соединения старого типа, такие как последовательные порты и модемы."
"Handles encryption and protects secrets like passwords and disk keys." = "Обеспечивает шифрование и защищает такие секреты, как пароли и ключи диска."
"Speeds up special kinds of work, such as AI tasks." = "Ускоряет специальные виды работы, например задачи искусственного интеллекта."
"Part of the processor, the computer's main brain." = "Часть процессора, «мозга» компьютера."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Встроенная часть материнской платы, обеспечивающая работу компьютера. Обычно вам не нужно об этом думать."
"A device that doesn't fit the usual groups." = "Устройство, которое не подходит под обычные группы."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Установите пакет, содержащий недостающую прошивку ({package}), затем перезагрузите компьютер."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "Драйверу нужен файл прошивки {file}, который не установлен. Найдите это имя файла в пакетах вашего дистрибутива, установите нужный пакет и перезагрузите компьютер."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Перезагрузите компьютер. Нужная прошивка сейчас установлена, но при запуске компьютера ее не было."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "Устройство не ответило драйверу вовремя. Перезагрузите компьютер. Если это плата внутри компьютера, проверьте, что она плотно вставлена в слот и что кабель питания (если он есть) подключён."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "Устройство ответило ошибками. Перезагрузите компьютер. Если это продолжает происходить, возможно, устройство или его соединение неисправны: попробуйте другой порт или слот, если можете."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Возможно, это устройство уже используется другим драйвером. Перезагрузка компьютера обычно решает эту проблему."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "Драйвер не смог запустить устройство. Перезагрузите компьютер. Если это повторяется, найдите в Интернете идентификатор оборудования устройства ({hardware_id}) вместе с «Linux»."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Драйвер для этого устройства ({module}) установлен, но не запущен. Запустите его сейчас с помощью этой команды. Обычно он запускается сам после перезагрузки."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "Драйвер {module} отключён настройкой в {file}. Чтобы снова включить его, удалите из этого файла строку с {module} и перезагрузите компьютер. Такие настройки иногда добавляют намеренно, например при установке другого графического драйвера."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "Драйвер {module} отключён в параметрах загрузки (командной строке ядра). Удалите там «{module}» из параметра blacklist и перезагрузите компьютер."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "Драйвер {module} запущен, но не подключился к этому устройству. Перезагрузка компьютера часто помогает. Если нет, причина обычно указана выше."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "Драйвер запустился, но не завершил настройку устройства. Перезагрузите компьютер. Если это не помогает, причина обычно указана выше (часто отсутствует прошивка)."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Это устройство было заблокировано вашими настройками безопасности USB (например, USBGuard). Если вы ему доверяете, разрешите его в этих настройках, затем отключите и подключите снова."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Связывает беспроводные мыши и клавиатуры Logitech с их приёмником и показывает их заряд батареи и настройки."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Показывает температуру, скорость помпы и вентиляторов систем жидкостного охлаждения и некоторых блоков питания, а также позволяет менять их скорость и подсветку."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "Это программа для командной строки. На её сайте есть инструкции по установке для каждого дистрибутива, включая способ, который работает везде, через pipx для Python."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Управляет подсветкой на RGB-устройствах многих брендов в одном месте, таких как материнские платы, память, клавиатуры и вентиляторы."
