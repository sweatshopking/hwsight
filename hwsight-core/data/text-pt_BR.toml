# Translations of the text in descriptions.toml and fixes.toml, language: pt_BR.
#
# Built into hwsight and replaceable by a newer downloaded copy, like the other data
# files. Each line maps the English text, exactly as written in those files, to its
# translation. English text that isn't listed here shows in English. Keep every
# placeholder such as {module} or {package} exactly as it is in the English.
schema = 1
version = "2026.11.06"
language = "pt_BR"

[text]
"Your graphics card. It draws everything you see on screen and does the heavy lifting in games and videos." = "Sua placa de vídeo. Ela desenha tudo o que você vê na tela e faz o trabalho pesado em jogos e vídeos."
"Sends sound to your speakers, headphones, or monitor, and takes sound in from microphones." = "Envia som para alto-falantes, fones de ouvido ou monitor e capta som de microfones."
"Connects your computer to a network with a cable (wired Ethernet)." = "Conecta seu computador a uma rede com um cabo (Ethernet com fio)."
"Connects your computer to wireless networks (Wi-Fi)." = "Conecta seu computador a redes sem fio (Wi-Fi)."
"A fast storage drive (an NVMe SSD) that holds your system, programs, and files." = "Uma unidade de armazenamento rápida (um SSD NVMe) que armazena seu sistema, programas e arquivos."
"Connects SATA drives, like hard drives, SSDs, and DVD drives, to the computer." = "Conecta unidades SATA, como discos rígidos, SSDs e unidades de DVD, ao computador."
"Runs a group of USB ports, so the devices you plug in can talk to the computer." = "Controla um grupo de portas USB, para que os dispositivos que você conecta possam se comunicar com o computador."
"Runs USB4 and Thunderbolt ports: very fast connections for docks, drives, and displays." = "Controla portas USB4 e Thunderbolt: conexões muito rápidas para docks, unidades e monitores."
"A small internal connection the motherboard uses to read sensors, such as temperatures and fan speeds, and to talk to the memory." = "Uma pequena conexão interna que a placa-mãe usa para ler sensores, como temperaturas e velocidades das ventoinhas, e para se comunicar com a memória."
"Connects the processor to the rest of the computer. It's part of the motherboard and works without a driver." = "Conecta o processador ao resto do computador. Faz parte da placa-mãe e funciona sem driver."
"Connects slower motherboard parts, like the firmware chip and fan controls." = "Conecta partes mais lentas da placa-mãe, como o chip do firmware e o controle das ventoinhas."
"Links expansion slots and built-in devices to the processor." = "Vincula slots de expansão e dispositivos integrados ao processador."
"Keeps devices from reading memory they shouldn't. Used for security and for virtual machines." = "Impede que dispositivos leiam memória que não deveriam acessar. Usado para segurança e para máquinas virtuais."
"A security chip that handles encryption and protects secrets like passwords and disk keys." = "Um chip de segurança que lida com criptografia e protege segredos como senhas e chaves de disco."
"An AI accelerator (a neural processing unit) that runs AI tasks quickly and efficiently." = "Um acelerador de IA (uma unidade de processamento neural) que executa tarefas de IA de forma rápida e eficiente."
"Adds Bluetooth, for wireless headphones, controllers, keyboards, and more." = "Adiciona Bluetooth, para fones de ouvido sem fio, controles, teclados e muito mais."
"Connects older storage drives and other devices that use the SCSI standard." = "Conecta unidades de armazenamento mais antigas e outros dispositivos que usam o padrão SCSI."
"Connects older hard drives and other storage devices that use the IDE standard." = "Conecta discos rígidos mais antigos e outros dispositivos de armazenamento que usam o padrão IDE."
"Combines several storage drives so they can work together for speed or protection." = "Combina várias unidades de armazenamento para que possam trabalhar juntas para obter velocidade ou proteção."
"Connects storage drives that use the ATA standard." = "Conecta unidades de armazenamento que usam o padrão ATA."
"Connects storage drives that use the SAS standard." = "Conecta unidades de armazenamento que usam o padrão SAS."
"Connects a storage device that does not use a more specific standard." = "Conecta um dispositivo de armazenamento que não utiliza um padrão mais específico."
"A second graphics processor that can help draw games, videos, and other pictures." = "Um segundo processador gráfico que pode ajudar a desenhar jogos, vídeos e outras imagens."
"Captures video from a camera, television signal, or another video source." = "Captura vídeo de uma câmera, sinal de televisão ou outra fonte de vídeo."
"An older sound card that plays and records sound." = "Uma placa de som mais antiga que reproduz e grava som."
"Connects older devices through a serial port, one bit at a time." = "Conecta dispositivos mais antigos através de uma porta serial, um bit de cada vez."
"Connects older printers and other devices through a parallel port." = "Conecta impressoras mais antigas e outros dispositivos através de uma porta paralela."
"Connects to the internet or another computer through a modem." = "Conecta-se à Internet ou a outro computador através de um modem."
"Reads memory cards through an SD card slot." = "Lê cartões de memória através de um slot para cartão SD."
"Connects older FireWire devices, such as cameras and storage drives." = "Conecta dispositivos FireWire mais antigos, como câmeras e unidades de armazenamento."
"Connects high-speed networks used by servers and other specialised computers." = "Conecta redes de alta velocidade usadas por servidores e outros computadores especializados."
"Connects devices through another type of serial bus." = "Conecta dispositivos através de outro tipo de barramento serial."
"Connects a wireless device that does not use a more specific wireless standard." = "Conecta um dispositivo sem fio que não usa um padrão sem fio mais específico."
"Helps the computer manage power or improve performance." = "Ajuda o computador a gerenciar energia ou melhorar o desempenho."
"A special-purpose device used to inspect or test the computer." = "Um dispositivo para fins especiais usado para inspecionar ou testar o computador."
"Plays or records sound over USB, like a headset, microphone, or audio interface." = "Reproduz ou grava som por USB, como fone de ouvido, microfone ou interface de áudio."
"A network or modem connection over USB." = "Uma conexão de rede ou modem via USB."
"Lets you control the computer, like a keyboard, mouse, game controller, or remote. Some lighting and cooling gadgets use this kind of connection too." = "Permite controlar o computador, como um teclado, mouse, controle de jogo ou controle remoto. Alguns dispositivos de iluminação e refrigeração também usam esse tipo de conexão."
"A camera or scanner that transfers pictures to the computer." = "Uma câmera ou scanner que transfere fotos para o computador."
"A printer connected by USB." = "Uma impressora conectada por USB."
"Stores files: a USB stick, card reader, or external drive." = "Armazena arquivos: um pendrive, leitor de cartão ou unidade externa."
"Adds more USB ports by sharing one connection." = "Adiciona mais portas USB compartilhando uma conexão."
"Reads smart cards, like ID, bank, or security cards." = "Lê cartões inteligentes, como cartões de identificação, bancários ou de segurança."
"A webcam or video capture device." = "Uma webcam ou dispositivo de captura de vídeo."
"Connects a personal healthcare device, such as a blood pressure monitor." = "Conecta um dispositivo pessoal de saúde, como um monitor de pressão arterial."
"Plays or records sound and video over USB." = "Reproduz ou grava som e vídeo via USB."
"Reports that a USB-C dock or adapter cannot use one of its connection modes." = "Relata que um dock ou adaptador USB-C não pode usar um de seus modos de conexão."
"A USB device used to inspect or test another device." = "Um dispositivo USB usado para inspecionar ou testar outro dispositivo."
"A USB device with a special purpose that does not fit another group." = "Um dispositivo USB com uma finalidade especial que não se enquadra em outro grupo."
"A USB device in firmware update mode." = "Um dispositivo USB em modo de atualização de firmware."
"A game controller (Xbox style)." = "Um controle de jogo (estilo Xbox)."
"Controls the pump, fans, and lighting of an NZXT liquid cooler." = "Controla a bomba, as ventoinhas e a iluminação de um water cooler NZXT."
"Controls the RGB lighting on your motherboard." = "Controla a iluminação RGB da sua placa-mãe."
"A wireless receiver for Logitech keyboards and mice (Logi Bolt)." = "Um receptor sem fio para teclados e mouses Logitech (Logi Bolt)."
"Draws everything you see on your screen." = "Desenha tudo o que você vê na tela."
"Plays sound through your speakers or headphones, and records from microphones." = "Reproduz som pelos alto-falantes ou fones de ouvido e grava pelos microfones."
"Connects your computer to the internet and other computers." = "Conecta seu computador à Internet e a outros computadores."
"Stores your system, programs, and files, or connects the drives that do." = "Armazena seu sistema, programas e arquivos ou conecta as unidades que o fazem."
"Runs USB ports, so the things you plug in can talk to the computer." = "Controla portas USB, para que o que você conecta possa se comunicar com o computador."
"Runs Thunderbolt and USB4 ports: very fast connections for docks, drives, and displays." = "Controla portas Thunderbolt e USB4: conexões muito rápidas para docks, unidades e monitores."
"Lets you control the computer: keyboards, mice, game controllers, and similar devices." = "Permite controlar o computador: teclados, mouses, controles de jogo e dispositivos semelhantes."
"Captures video or pictures, like a webcam." = "Captura vídeos ou fotos, como uma webcam."
"Prints or scans documents and photos." = "Imprime ou digitaliza documentos e fotos."
"Sends data over older-style connections such as serial ports and modems." = "Envia dados por meio de conexões antigas, como portas seriais e modems."
"Handles encryption and protects secrets like passwords and disk keys." = "Lida com criptografia e protege segredos como senhas e chaves de disco."
"Speeds up special kinds of work, such as AI tasks." = "Acelera tipos especiais de trabalho, como tarefas de IA."
"Part of the processor, the computer's main brain." = "Parte do processador, o cérebro do computador."
"A built-in part of your motherboard that keeps the computer running. You normally never need to think about it." = "Uma parte integrada da placa-mãe que mantém o computador funcionando. Você normalmente nunca precisa pensar sobre isso."
"A device that doesn't fit the usual groups." = "Um dispositivo que não se enquadra nos grupos habituais."
"Install the package that contains the missing firmware ({package}), then restart the computer." = "Instale o pacote que contém o firmware ausente ({package}) e reinicie o computador."
"The driver needs the firmware file {file}, which isn't installed. Search your distro's packages for that file name, install it, then restart." = "O driver precisa do arquivo de firmware {file}, que não está instalado. Procure esse nome de arquivo nos pacotes da sua distribuição, instale o pacote e reinicie."
"Restart the computer. The firmware it needs is installed now, but it was missing when the computer started." = "Reinicie o computador. O firmware necessário está instalado agora, mas estava faltando quando o computador foi iniciado."
"The device didn't answer the driver in time. Restart the computer. If it's a card inside the computer, check it's pushed firmly into its slot and its power cable (if it has one) is connected." = "O dispositivo não respondeu ao driver a tempo. Reinicie o computador. Se for uma placa dentro do computador, verifique se ela está bem encaixada no slot e se o cabo de alimentação (se houver) está conectado."
"The device answered with errors. Restart the computer. If it keeps happening, the device or its connection may be faulty: try another port or slot if you can." = "O dispositivo respondeu com erros. Reinicie o computador. Se isso continuar acontecendo, o dispositivo ou sua conexão podem estar com defeito: tente outra porta ou slot, se puder."
"Another driver may already be using this device. Restarting the computer usually sorts this out." = "Outro driver pode já estar usando este dispositivo. Reiniciar o computador geralmente resolve isso."
"The driver couldn't start the device. Restart the computer. If it keeps happening, search online for the device's hardware ID ({hardware_id}) together with \"Linux\"." = "O driver não conseguiu iniciar o dispositivo. Reinicie o computador. Se isso continuar acontecendo, pesquise online o ID de hardware do dispositivo ({hardware_id}) junto com \"Linux\"."
"A driver for this device ({module}) is installed but isn't running. Start it now with this command. It normally starts by itself after a restart." = "Um driver para este dispositivo ({module}) está instalado, mas não está em execução. Inicie-o agora com este comando. Normalmente ele inicia sozinho depois de reiniciar."
"The {module} driver is turned off by a setting in {file}. To turn it back on, remove the line that mentions {module} from that file, then restart. Settings like this are sometimes added on purpose, for example when installing another graphics driver." = "O driver {module} é desativado por uma configuração em {file}. Para ligá-lo novamente, remova a linha que menciona {module} desse arquivo e reinicie. Às vezes, configurações como essa são adicionadas propositalmente, por exemplo, ao instalar outro driver gráfico."
"The {module} driver is turned off in your boot settings (the kernel command line). Remove \"{module}\" from the blacklist option there, then restart." = "O driver {module} está desligado nas configurações de inicialização (a linha de comando do kernel). Remova \"{module}\" da opção de lista negra e reinicie."
"The {module} driver is running but didn't take this device. Restarting the computer often fixes this. If not, the reason is usually shown above." = "O driver {module} está em execução, mas não utilizou este dispositivo. Reiniciar o computador geralmente corrige isso. Caso contrário, o motivo geralmente é mostrado acima."
"The driver started but didn't finish setting the device up. Restart the computer. If that doesn't help, the reason is usually shown above (often missing firmware)." = "O driver foi iniciado, mas não concluiu a configuração do dispositivo. Reinicie o computador. Se isso não ajudar, o motivo geralmente é mostrado acima (muitas vezes falta firmware)."
"This device was blocked by your USB security settings (such as USBGuard). If you trust it, allow it in those settings, then unplug it and plug it back in." = "Este dispositivo foi bloqueado pelas configurações de segurança USB (como o USBGuard). Se você confia nele, permita-o nessas configurações, depois desconecte-o e conecte-o novamente."
"Pairs Logitech wireless mice and keyboards with their receiver, and shows their battery level and settings." = "Pareia mouses e teclados sem fio Logitech com o receptor e mostra o nível da bateria e as configurações deles."
"Shows the temperature, pump, and fan speeds of liquid coolers and some power supplies, and lets you change their speeds and lights." = "Mostra a temperatura e a velocidade da bomba e das ventoinhas de water coolers e de algumas fontes de alimentação, e permite alterar as velocidades e as luzes deles."
"It's a command-line program. Its website has install steps for every distro, including one that works everywhere through Python's pipx." = "É um programa de linha de comando. O site dele tem passos de instalação para cada distribuição, incluindo um que funciona em qualquer lugar com o pipx do Python."
"Controls the lights on RGB devices from many brands in one place, such as motherboards, memory, keyboards, and fans." = "Controla as luzes de dispositivos RGB de diversas marcas em um só lugar, como placas-mãe, memórias, teclados e ventoinhas."
